<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heads or Tails</title>
<meta name="description" content="Toss a fully animated 3D coin on a lamplit table or a cricket pitch. The camera rides up with it, then it lands heads or tails.">
<meta name="theme-color" content="#0B1417">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700&text=%E0%A4%AD%E0%A4%BE%E0%A4%B0%E0%A4%A4%20%E0%A4%B8%E0%A4%A4%E0%A5%8D%E0%A4%AF%E0%A4%AE%E0%A5%87%E0%A4%B5%20%E0%A4%9C%E0%A4%AF%E0%A4%A4%E0%A5%87&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0B1417;
    --ink-soft: rgba(11, 20, 23, 0.74);
    --gold: #D2A54C;
    --gold-hi: #F3D48A;
    --silver: #D9DEE1;
    --amber: #F4B860;
    --parchment: #F1E7D0;
    --sage: #93A29C;
    --line: rgba(241, 231, 208, 0.16);
    --win: #A8D59A;
    --lose: #EE9C86;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--parchment);
    font: 15px/1.45 Manrope, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- 3D stage ---------- */
  #stage { position: fixed; inset: 0; background: var(--ink); }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(11, 20, 23, 0.72), rgba(11, 20, 23, 0) 20%, rgba(11, 20, 23, 0) 60%, rgba(11, 20, 23, 0.8)),
      radial-gradient(120% 90% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(4, 8, 10, 0.55));
  }

  /* While the coin spins on its edge, everything but the coin falls back. */
  #stage .focus {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(60% 50% at 50% 50%, rgba(3, 6, 8, 0) 45%, rgba(3, 6, 8, 0.75));
    transition: opacity 0.8s ease;
  }
  body.tense #stage .focus { opacity: 1; }
  .top, .call, .hint { transition: opacity 0.6s ease; }
  body.tense .top, body.tense .call, body.tense .hint { opacity: 0.3; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 20px);
    padding-inline: max(16px, env(safe-area-inset-left, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px) + 16px);
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background:
      radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 46%),
      radial-gradient(circle, #E3B85E 0 40%, #5E4E30 41% 45%, #DDE2E4 46% 76%, #979EA3 77% 100%);
    box-shadow: 0 0 18px rgba(244, 184, 96, 0.3);
  }
  .brand h1 {
    margin: 0;
    font: 800 15px/1.1 Manrope, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--sage); }

  .score { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .tally { display: flex; align-items: center; gap: 14px; }
  .count { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
  .count .k { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); margin-bottom: 4px; }
  .count .v { font: 700 20px/1 Manrope, "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; padding: 0;
    display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--ink-soft); color: var(--parchment);
    cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off { display: none; }
  .icon-btn[aria-pressed="false"] .on { display: none; }
  .icon-btn[aria-pressed="false"] .off { display: block; }
  .history { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; justify-content: flex-end; max-width: min(58vw, 300px); overflow: hidden; }
  .history li {
    flex: none; width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    font: 800 9px/1 Manrope, "Segoe UI", system-ui, sans-serif;
  }
  .history li.h { background: linear-gradient(160deg, #F3D48A, #B8872F); color: #3A2708; }
  .history li.t { border: 1.5px solid var(--silver); color: var(--silver); }
  .history li:first-child { box-shadow: 0 0 0 2px var(--ink), 0 0 0 3px var(--amber); }
  .reset {
    background: none; border: 0; padding: 2px 0; cursor: pointer;
    color: var(--sage); font: inherit; font-size: 11px; letter-spacing: 0.06em;
    text-decoration: underline; text-underline-offset: 3px;
  }

  .bottom { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .result {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    opacity: 0; transform: translateY(10px) scale(0.98);
    transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .result.show { opacity: 1; transform: none; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--amber); }
  .word {
    font: 800 clamp(46px, 13vw, 92px)/1 Manrope, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.08em;
    margin-right: -0.08em;
    text-transform: uppercase;
    color: var(--parchment);
    text-shadow: 0 2px 30px rgba(244, 184, 96, 0.35);
  }
  .result.show .word { animation: strike 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes strike { from { letter-spacing: 0.32em; opacity: 0; } to { letter-spacing: 0.08em; opacity: 1; } }
  .meta { font: 500 12px/1.4 Manrope, "Segoe UI", system-ui, sans-serif; color: var(--sage); font-variant-numeric: tabular-nums; }
  .verdict { font-weight: 700; font-size: 14px; }
  .verdict:empty { display: none; }
  .verdict.win { color: var(--win); }
  .verdict.lose { color: var(--lose); }

  .controls { pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 10px 14px; flex-wrap: wrap; }
  .call { display: flex; align-items: center; gap: 6px; }
  .call .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); margin-right: 4px; }
  .chip {
    border: 1px solid var(--line); background: var(--ink-soft); color: var(--parchment);
    font: 700 13px/1 Manrope, "Segoe UI", system-ui, sans-serif;
    padding: 10px 14px; border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #2A1C08; }
  .toss {
    border: 0; border-radius: 999px; padding: 15px 34px; cursor: pointer;
    font: 800 15px/1 Manrope, "Segoe UI", system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase;
    color: #2A1A06;
    background: linear-gradient(180deg, #F7D98F, #C8923B);
    box-shadow: 0 10px 30px rgba(244, 184, 96, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(90, 55, 10, 0.35);
  }
  .toss:active { transform: translateY(1px); }
  .toss:disabled { cursor: default; opacity: 0.5; }
  .hint { margin: 0; font-size: 12px; color: var(--sage); min-height: 1.45em; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  /* ---------- Scene and coin picker ---------- */
  .brand-col { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; min-width: 0; }
  .look {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--ink-soft); color: var(--parchment);
    font: 700 12px/1 Manrope, "Segoe UI", system-ui, sans-serif;
    padding: 8px 10px 8px 12px; border-radius: 999px; cursor: pointer;
  }
  .look svg { width: 12px; height: 12px; flex: none; }
  .look:disabled { opacity: 0.5; cursor: default; }
  .panel {
    position: fixed;
    z-index: 5;
    width: min(300px, calc(100vw - 32px));
    display: grid; gap: 14px;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: rgba(11, 20, 23, 0.94);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .panel h2 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); }
  .options { display: grid; gap: 6px; }
  .opt {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left;
    border: 1px solid var(--line); background: rgba(241, 231, 208, 0.04); color: var(--parchment);
    font: 700 14px/1.25 Manrope, "Segoe UI", system-ui, sans-serif;
    padding: 11px 12px; border-radius: 12px; cursor: pointer;
  }
  .opt small { display: block; margin-top: 3px; font-size: 12px; font-weight: 500; color: var(--sage); }
  .opt::after { content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
  .opt[aria-pressed="true"] { border-color: rgba(210, 165, 76, 0.7); background: rgba(210, 165, 76, 0.14); }
  .opt[aria-pressed="true"]::after { background: var(--gold); border-color: var(--gold); }

  /* Daylight at the ground: lighter scrims so the sky stays bright. */
  body.scene-ground #stage::after {
    background:
      linear-gradient(to bottom, rgba(11, 20, 23, 0.55), rgba(11, 20, 23, 0) 18%, rgba(11, 20, 23, 0) 54%, rgba(11, 20, 23, 0.86)),
      radial-gradient(120% 90% at 50% 50%, rgba(0, 0, 0, 0) 62%, rgba(4, 8, 10, 0.28));
  }
  body.scene-ground .hud { text-shadow: 0 1px 10px rgba(5, 12, 16, 0.5); }

  .fallback {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-inline: 24px; text-align: center; background: var(--ink); color: var(--parchment);
  }
  .fallback p { max-width: 36ch; }

  @media (max-width: 520px) {
    .brand p { display: none; }
    .brand h1 { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .result { transition: opacity 0.2s linear; transform: none; }
    .result.show .word { animation: none; }
  }
</style>
</head>
<body>
<main id="app">
  <div id="stage"><canvas id="scene" aria-hidden="true"></canvas><div class="focus" aria-hidden="true"></div></div>

  <div class="hud">
    <header class="top">
      <div class="brand-col">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>Heads or Tails</h1>
            <p>Fair 50/50 from your browser's secure random generator</p>
          </div>
        </div>
        <button class="look" id="lookBtn" type="button" aria-expanded="false" aria-controls="lookPanel">
          <span id="lookLabel">Table · Cricket coin</span>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="score">
        <div class="tally">
          <div class="count"><span class="k">Heads</span><span class="v" id="nH">0</span></div>
          <div class="count"><span class="k">Tails</span><span class="v" id="nT">0</span></div>
          <button id="sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
          </button>
        </div>
        <ol class="history" id="history" aria-label="Recent tosses, newest first"></ol>
        <button class="reset" id="reset" type="button" hidden>Reset tally</button>
      </div>
    </header>

    <footer class="bottom">
      <div class="result" id="result" aria-live="polite">
        <div class="eyebrow" id="resEyebrow"></div>
        <div class="word" id="resWord"></div>
        <div class="meta" id="resMeta"></div>
        <div class="verdict" id="verdict"></div>
      </div>
      <div class="controls">
        <div class="call" role="group" aria-label="Call it before you toss">
          <span class="label">Call it</span>
          <button class="chip" type="button" data-call="H" aria-pressed="false">Heads</button>
          <button class="chip" type="button" data-call="T" aria-pressed="false">Tails</button>
        </div>
        <button class="toss" id="tossBtn" type="button">Toss</button>
      </div>
      <p class="hint" id="hint">Tap the table or press Space to toss</p>
    </footer>
  </div>

  <div class="panel" id="lookPanel" role="dialog" aria-label="Where to toss and which coin" hidden>
    <section>
      <h2>Where</h2>
      <div class="options">
        <button class="opt" type="button" data-scene="table" aria-pressed="false"><span>Lamplit table<small>Night, a pendant lamp, walnut</small></span></button>
        <button class="opt" type="button" data-scene="ground" aria-pressed="false"><span>Cricket ground<small>Day match, on the pitch</small></span></button>
      </div>
    </section>
    <section>
      <h2>Coin</h2>
      <div class="options">
        <button class="opt" type="button" data-coin="cricket" aria-pressed="false"><span>Cricket toss coin<small>Silver and gold, bats and stumps</small></span></button>
        <button class="opt" type="button" data-coin="rupee2" aria-pressed="false"><span>Indian ₹2 coin<small>Steel, Lion Capital and ₹2</small></span></button>
      </div>
    </section>
  </div>

  <div class="fallback" id="fallback" hidden><p id="fallbackMsg"></p></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});

  function showFallback(msg) {
    $('fallbackMsg').textContent = msg;
    $('fallback').hidden = false;
  }

  function start(hotData) {
    var T3 = window.THREE;
    if (!T3) {
      showFallback('The 3D engine did not load. Check your connection and reload the page.');
      return;
    }

    /* ================= Per-viewer state ================= */
    var KEY = 'heads-or-tails:v1';
    function loadSaved() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    }
    var saved = Object.assign({}, loadSaved(), hotData || {});
    var state = {
      counts: { H: (saved.counts && saved.counts.H) | 0, T: (saved.counts && saved.counts.T) | 0 },
      history: Array.isArray(saved.history) ? saved.history.filter(function (f) { return f === 'H' || f === 'T'; }).slice(0, 40) : [],
      call: saved.call === 'H' || saved.call === 'T' ? saved.call : null,
      muted: !!saved.muted,
      face: saved.face === 'T' ? 'T' : 'H',
      scene: saved.scene === 'ground' ? 'ground' : 'table',
      coin: saved.coin === 'rupee2' ? 'rupee2' : 'cricket'
    };
    function persist() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
    }
    try {
      if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return state; });
    } catch (e) { /* hot reload unsupported */ }

    var reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    /* ================= Randomness ================= */
    function fairFace() {
      if (window.crypto && crypto.getRandomValues) {
        var b = new Uint8Array(1);
        crypto.getRandomValues(b);
        return (b[0] & 1) ? 'H' : 'T';
      }
      return Math.random() < 0.5 ? 'H' : 'T';
    }
    var rnd = Math.random;

    /* ================= Renderer ================= */
    var canvas = $('scene');
    var renderer;
    try {
      renderer = new T3.WebGLRenderer({ canvas: canvas, antialias: true, stencil: false, powerPreference: 'high-performance' });
    } catch (e) {
      showFallback('This browser could not start WebGL, which the 3D coin needs. Try another browser or device.');
      return;
    }
    // Phones get a lighter setup: fewer pixels, smaller textures, fewer particles.
    var MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
    var Q = MOBILE
      ? { ratioCap: 1.5, aniso: 4, faceTex: 768, fieldTex: 1024, shadow: 1024, dust: 300, bokeh: 16 }
      : { ratioCap: 2, aniso: 16, faceTex: 1024, fieldTex: 2048, shadow: 2048, dust: 800, bokeh: 34 };
    var pixelRatio = Math.min(window.devicePixelRatio || 1, Q.ratioCap);
    renderer.setPixelRatio(pixelRatio);
    renderer.outputEncoding = T3.sRGBEncoding;
    renderer.toneMapping = T3.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T3.PCFSoftShadowMap;
    var maxAniso = Math.min(Q.aniso, renderer.capabilities.getMaxAnisotropy());

    var INK = 0x0B1417;
    var scene = new T3.Scene();
    scene.background = new T3.Color(INK);
    scene.fog = new T3.FogExp2(INK, 0.011);

    var camera = new T3.PerspectiveCamera(42, 1, 0.05, 500);

    function makeCanvas(w, h) {
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }
    function circlePath(ctx, x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }

    /* ================= Reflection environments ================= */
    function bakeEnv(envScene) {
      var pmrem = new T3.PMREMGenerator(renderer);
      var tex = pmrem.fromScene(envScene, 0.035).texture;
      pmrem.dispose();
      return tex;
    }
    function gradientSphere(stops) {
      var c = makeCanvas(8, 256), g = c.getContext('2d');
      var grd = g.createLinearGradient(0, 0, 0, 256);
      stops.forEach(function (s) { grd.addColorStop(s[0], s[1]); });
      g.fillStyle = grd;
      g.fillRect(0, 0, 8, 256);
      var tex = new T3.CanvasTexture(c);
      tex.encoding = T3.sRGBEncoding;
      return new T3.Mesh(new T3.SphereGeometry(10, 32, 16), new T3.MeshBasicMaterial({ map: tex, side: T3.BackSide }));
    }
    var tableEnvScene = (function () {
      var env = new T3.Scene();
      env.add(gradientSphere([[0, '#fff4e0'], [0.22, '#d2a263'], [0.42, '#5b503e'], [0.58, '#1d2a2b'], [1, '#2c1d12']]));
      var lampDisk = new T3.Mesh(new T3.CircleGeometry(2.6, 32), new T3.MeshBasicMaterial({ color: new T3.Color(7, 5.6, 3.8) }));
      lampDisk.position.set(0, 9, 0);
      lampDisk.rotation.x = Math.PI / 2;
      env.add(lampDisk);
      // Soft panels around the horizon give the coin edge its glints.
      var panelMat = new T3.MeshBasicMaterial({ color: new T3.Color(1.5, 1.35, 1.1), side: T3.DoubleSide });
      for (var i = 0; i < 5; i++) {
        var a = (i / 5) * Math.PI * 2 + 0.4;
        var p = new T3.Mesh(new T3.PlaneGeometry(3.2, 4.5), panelMat);
        p.position.set(Math.cos(a) * 8.5, 3.2, Math.sin(a) * 8.5);
        p.lookAt(0, 0, 0);
        env.add(p);
      }
      return env;
    })();
    var tableEnv = bakeEnv(tableEnvScene);
    scene.environment = tableEnv;

    /* ================= Coin ================= */
    var R = 1;            // coin radius (1 unit = 12 mm)
    var TH = 0.13;        // thickness
    var REST_Y = TH / 2;
    var UNIT_CM = 1.2;

    function arcText(ctx, text, cx, cy, radius, top, font, spacing) {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var chars = Array.from(text);
      var widths = chars.map(function (ch) { return ctx.measureText(ch).width; });
      var total = widths.reduce(function (a, b) { return a + b; }, 0) + spacing * (chars.length - 1);
      var run = -total / 2;
      chars.forEach(function (ch, i) {
        var mid = run + widths[i] / 2;
        run += widths[i] + spacing;
        var a = top ? -Math.PI / 2 + mid / radius : Math.PI / 2 - mid / radius;
        ctx.save();
        ctx.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
        ctx.rotate(top ? a + Math.PI / 2 : a - Math.PI / 2);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // Engraved outline around the current path, so overlapping relief reads as separate pieces.
    function groove(ctx, C, width) {
      ctx.save();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = C.engrave;
      ctx.lineWidth = width;
      ctx.stroke();
      ctx.restore();
    }

    // A cricket ball with its double seam.
    function drawBall(ctx, x, y, r, C) {

      ctx.fillStyle = C.raised;
      circlePath(ctx, x, y, r);
      ctx.fill();
      ctx.clip();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = C.engrave;
      ctx.lineWidth = Math.max(1.5, r * 0.08);

        ctx.beginPath();
        ctx.arc(x - r * 1.55, y, r * (1.75 + o), -0.7, 0.7);
        ctx.stroke();
      });
      ctx.restore();
    }

    // Heads: two crossed bats, blades down, with a ball in the V of the handles.
    function drawBats(ctx, c, k, C) {
      ctx.save();

        var w = 38 * k;

        ctx.rotate(dir * 0.52);
        ctx.beginPath();
        ctx.moveTo(-w, -34 * k);
        ctx.lineTo(-w, 204 * k);

        ctx.lineTo(w, -34 * k);
        ctx.quadraticCurveTo(w, -56 * k, 14 * k, -64 * k);
        ctx.lineTo(-14 * k, -64 * k);
        ctx.quadraticCurveTo(-w, -56 * k, -w, -34 * k);

        groove(ctx, C, 6 * k);

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = C.raised;
        ctx.lineCap = 'round';
        ctx.lineWidth = 12 * k;
        ctx.beginPath();
        ctx.moveTo(0, -22 * k);
        ctx.lineTo(0, 212 * k);
        ctx.stroke();
        ctx.restore();
        roundRectPath(ctx, -13 * k, -176 * k, 26 * k, 118 * k, 12 * k);
        ctx.fillStyle = C.raised;
        ctx.fill();
        groove(ctx, C, 5 * k);

        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = C.engrave;
        ctx.lineWidth = 4 * k;
        for (var i = 0; i < 6; i++) {

          ctx.beginPath();
          ctx.moveTo(-13 * k, y);
          ctx.lineTo(13 * k, y + 6 * k);
          ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
      });
      drawBall(ctx, 0, -128 * k, 40 * k, C);
      ctx.restore();
    }

    function drawLaurel(ctx, k, C, side) {
      var R0 = 256 * k;
      var a1 = Math.PI / 2 - side * 0.2;
      var a2 = Math.PI / 2 - side * 1.95;
      var fwd = a2 > a1 ? 1 : -1;
      ctx.strokeStyle = C.raised;
      ctx.lineWidth = 6 * k;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, R0, a1, a2, fwd < 0);
      ctx.stroke();
      ctx.fillStyle = C.raised;
      for (var i = 0; i < 9; i++) {
        var t = (i + 0.6) / 9.2;
        var a = a1 + (a2 - a1) * t;
        var scale = 1 - 0.4 * t;
        var heading = Math.atan2(Math.cos(a) * fwd, -Math.sin(a) * fwd);
        [1, -1].forEach(function (s) {
          var rr = R0 + s * 15 * k * scale;
          ctx.save();
          ctx.translate(Math.cos(a) * rr, Math.sin(a) * rr);
          ctx.rotate(heading + s * side * 0.55);
          ctx.beginPath();
          ctx.ellipse(10 * k * scale, 0, 22 * k * scale, 9 * k * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

    // Tails: three stumps with the bails on top, framed by a laurel.
    function drawStumps(ctx, c, k, C) {
      ctx.save();
      ctx.translate(c, c - 6 * k);

      [-68, 0, 68].forEach(function (x) {
        roundRectPath(ctx, (x - w / 2) * k, top * k, w * k, (bottom - top) * k, 14 * k);
        ctx.fillStyle = C.raised;
        ctx.fill();
        groove(ctx, C, 5 * k);
        ctx.save();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = C.plate;
        ctx.lineCap = 'round';
        ctx.lineWidth = 5 * k;
        ctx.beginPath();
        ctx.moveTo((x - 6) * k, (top + 20) * k);
        ctx.lineTo((x - 6) * k, (bottom - 22) * k);
        ctx.stroke();
        ctx.restore();
      });
      [-34, 34].forEach(function (x) {
        roundRectPath(ctx, (x - 38) * k, (top - 19) * k, 76 * k, 15 * k, 7 * k);
        ctx.fillStyle = C.raised;
        ctx.fill();
        groove(ctx, C, 4 * k);

      ctx.fillStyle = C.raised;
      ctx.fill();
      groove(ctx, C, 3 * k);
      ctx.restore();

      drawLaurel(ctx, k, C, -1);

    // A bimetallic toss coin: silver ring, gold centre.
    function drawFace(ctx, side, mode) {
      var S = ctx.canvas.width, c = S / 2, k = S / 1024;

        : { raised: '#ffffff', blade: '#e6e6e6', plate: '#c4c4c4', engrave: '#7a7a7a' };

        ? { raised: '#eef1f2', engrave: '#5a6165' }

        gg.addColorStop(1, '#976d28');

        ctx.fillStyle = '#6e6e6e';

      ctx.fill();

      for (var i = 0; i < 7000; i++) {

      ctx.lineWidth = 5 * k;
      circlePath(ctx, c, c, JOINT);

      ctx.strokeStyle = Sv.raised;
      ctx.lineWidth = 4 * k;
      circlePath(ctx, c, c, 447 * k);
      ctx.stroke();
      ctx.lineCap = 'round';
      ctx.lineWidth = 5 * k;
      for (var j = 0; j < 84; j++) {
        var b = (j / 84) * Math.PI * 2;

          ctx.save();

          ctx.rotate(b + Math.PI / 2 + st[1]);
          ctx.beginPath();
          ctx.moveTo(-7 * k, 0);
          ctx.lineTo(7 * k, 0);
          ctx.stroke();
          ctx.restore();

      var sans = 'Manrope, "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = Sv.raised;
      arcText(ctx, side === 'H' ? 'HEADS' : 'TAILS', c, c, 380 * k, true, '800 ' + 64 * k + 'px ' + sans, 18 * k);
      arcText(ctx, side === 'H' ? 'BAT OR BOWL' : 'CAPTAIN’S CALL', c, c, 382 * k, false, '800 ' + 42 * k + 'px ' + sans, 10 * k);
      [0, Math.PI].forEach(function (a2) {
        drawBall(ctx, c + Math.cos(a2) * 380 * k, c + Math.sin(a2) * 380 * k, 15 * k, Sv);
      });

      // Gold centre: a raised lip, then the emblem.
      if (color) ctx.shadowColor = 'rgba(60,38,8,0.55)';
      ctx.strokeStyle = G.raised;
      ctx.lineWidth = 8 * k;
      circlePath(ctx, c, c, 311 * k);
      ctx.stroke();
      if (side === 'H') drawBats(ctx, c, k, G);
      else drawStumps(ctx, c, k, G);
      ctx.restore();
    }

    // Splits text into the letters a reader sees, so Devanagari syllables stay whole.
    function clusters(text) {
      if (window.Intl && Intl.Segmenter) {
        return Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text), function (s) { return s.segment; });
      }
      return /[ऀ-ॿ]/.test(text) ? [text] : Array.from(text);
    }

    // Text running clockwise around a circle, letter tops toward the rim.
    function arcTextAround(ctx, text, cx, cy, radius, centerAngle, font, spacing) {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var parts = clusters(text);
      var widths = parts.map(function (p) { return ctx.measureText(p).width; });
      var total = widths.reduce(function (a, b) { return a + b; }, 0) + spacing * (parts.length - 1);
      var run = -total / 2;
      parts.forEach(function (p, i) {
        var mid = run + widths[i] / 2;
        run += widths[i] + spacing;
        var a = centerAngle + mid / radius;
        ctx.save();
        ctx.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
        ctx.rotate(a + Math.PI / 2);
        ctx.fillText(p, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }

    // The Lion Capital of Ashoka, simplified for a coin: three lions on an abacus
    // carrying the Dharma Chakra, a galloping horse and a bull.
    function drawLionCapital(ctx, x, y, k, C) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(k, k);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

        ctx.fillStyle = fill;
        ctx.fill();
        groove(ctx, C, w);

        ctx.save();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = C.engrave;
        ctx.lineWidth = w;

          var b = ((j + 0.5) / tufts) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(b) * rx * 0.55, cy + Math.sin(b) * ry * 0.55);
          ctx.quadraticCurveTo(cx + Math.cos(b + 0.12) * rx * 0.8, cy + Math.sin(b + 0.12) * ry * 0.8,

      function sideLion() {
        ctx.beginPath(); ctx.ellipse(-86, -4, 40, 46, 0, 0, Math.PI * 2); solid(C.raised, 3);
        roundRectPath(ctx, -120, -2, 24, 44, 10); solid(C.raised, 3);
        ctx.beginPath(); ctx.ellipse(-112, 40, 16, 6, 0, 0, Math.PI * 2); solid(C.raised, 2.5);
        mane(-84, -84, 48, 56, 13);
        ctx.beginPath();
        ctx.moveTo(-100, -120);
        ctx.quadraticCurveTo(-128, -124, -140, -104);
        ctx.lineTo(-152, -94);
        ctx.quadraticCurveTo(-156, -84, -147, -80);
        ctx.lineTo(-131, -79);
        ctx.lineTo(-146, -70);
        ctx.quadraticCurveTo(-140, -58, -118, -60);
        ctx.quadraticCurveTo(-98, -68, -96, -96);
        ctx.closePath();
        solid(C.plate, 3);
        ctx.beginPath(); ctx.arc(-124, -101, 4, 0, Math.PI * 2); ctx.fillStyle = C.engrave; ctx.fill();
        ctx.beginPath(); ctx.moveTo(-146, -90); ctx.quadraticCurveTo(-140, -88, -136, -92); cut(2);
      }

      // The abacus and the slab the lions stand on.
      roundRectPath(ctx, -140, 58, 280, 58, 6); solid(C.raised, 3);
      roundRectPath(ctx, -152, 42, 304, 16, 5); solid(C.raised, 3);
      // Dharma Chakra with 24 spokes, and small wheels at the ends.
      ctx.beginPath(); ctx.arc(0, 87, 22, 0, Math.PI * 2); solid(C.plate, 3);
      ctx.beginPath(); ctx.arc(0, 87, 17, 0, Math.PI * 2); cut(2);
      for (var s = 0; s < 24; s++) {

        ctx.beginPath();
        ctx.moveTo(Math.cos(sa) * 5, 87 + Math.sin(sa) * 5);
        ctx.lineTo(Math.cos(sa) * 17, 87 + Math.sin(sa) * 17);

      ctx.beginPath(); ctx.arc(0, 87, 4.5, 0, Math.PI * 2); ctx.fillStyle = C.engrave; ctx.fill();
      [-1, 1].forEach(function (side) {
        ctx.beginPath(); ctx.arc(side * 121, 87, 12, 0, Math.PI * 2); cut(2.2);
        for (var w = 0; w < 8; w++) {
          var wa = (w / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(side * 121, 87);
          ctx.lineTo(side * 121 + Math.cos(wa) * 12, 87 + Math.sin(wa) * 12);
          cut(1.4);
        }
      });
      // A galloping horse on the left and a bull on the right, cut into the abacus.
      ctx.save();
      ctx.fillStyle = C.engrave;
      ctx.strokeStyle = C.engrave;
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.ellipse(-60, 86, 21, 8, -0.08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-76, 84); ctx.quadraticCurveTo(-84, 74, -90, 70); ctx.lineTo(-96, 74); ctx.lineTo(-88, 80);
      ctx.quadraticCurveTo(-82, 86, -72, 90); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-74, 90); ctx.lineTo(-86, 100); ctx.moveTo(-70, 92); ctx.lineTo(-76, 106);
      ctx.moveTo(-48, 91); ctx.lineTo(-40, 105); ctx.moveTo(-44, 90); ctx.lineTo(-34, 100);
      ctx.moveTo(-40, 83); ctx.quadraticCurveTo(-32, 84, -28, 92);
      ctx.stroke();
      ctx.beginPath(); ctx.ellipse(60, 88, 22, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(50, 78, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(84, 92, 8, 6, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(84, 86); ctx.lineTo(90, 79);
      ctx.moveTo(44, 95); ctx.lineTo(42, 108); ctx.moveTo(52, 96); ctx.lineTo(52, 108);
      ctx.moveTo(70, 96); ctx.lineTo(70, 108); ctx.moveTo(77, 95); ctx.lineTo(80, 107);
      ctx.moveTo(38, 86); ctx.quadraticCurveTo(33, 92, 35, 101);
      ctx.stroke();
      ctx.restore();

      // The side lions, then the front lion over them.
      sideLion();
      ctx.save();
      ctx.scale(-1, 1);
      sideLion();
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(0, -14, 50, 44, 0, 0, Math.PI * 2); solid(C.raised, 3);
      [-1, 1].forEach(function (side) {
        roundRectPath(ctx, side * 26 - 12, -12, 24, 54, 10); solid(C.raised, 3);
        ctx.beginPath(); ctx.ellipse(side * 26, 40, 16, 6, 0, 0, Math.PI * 2); solid(C.raised, 2.5);
      });
      mane(0, -90, 64, 66, 16);
      ctx.beginPath(); ctx.ellipse(0, -86, 34, 42, 0, 0, Math.PI * 2); solid(C.plate, 3);
      [-1, 1].forEach(function (side) {
        ctx.beginPath(); ctx.moveTo(side * 24, -108); ctx.quadraticCurveTo(side * 13, -115, side * 4, -106); cut(2.6);
        ctx.beginPath(); ctx.arc(side * 13, -99, 4, 0, Math.PI * 2); ctx.fillStyle = C.engrave; ctx.fill();
        ctx.beginPath(); ctx.moveTo(side * 5, -100); ctx.lineTo(side * 7, -78); cut(2.2);
      });
      ctx.beginPath(); ctx.ellipse(0, -72, 13, 8, 0, 0, Math.PI * 2); solid(C.raised, 2.4);
      ctx.beginPath(); ctx.moveTo(-18, -60); ctx.quadraticCurveTo(0, -48, 18, -60); cut(3);
      ctx.beginPath(); ctx.moveTo(0, -64); ctx.lineTo(0, -56); cut(2.2);
      ctx.restore();
    }

    // The ₹ sign, drawn as strokes so it looks the same on every device.
    function drawRupeeSign(ctx, x, y, h, C) {
      var w = h * 0.72, lw = h * 0.11;
      ctx.save();
      ctx.translate(x - w / 2, y - h / 2);
      ctx.strokeStyle = C.raised;
      ctx.lineWidth = lw;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.moveTo(0, lw / 2); ctx.lineTo(w, lw / 2);
      ctx.moveTo(0, h * 0.28); ctx.lineTo(w, h * 0.28);

      ctx.lineTo(w * 0.86, h);
      ctx.stroke();
      ctx.restore();
    }

    // An ear of grain curving up beside the numeral.
    function drawGrain(ctx, c, k, C, side) {
      var R0 = 292 * k;
      var a1 = Math.PI / 2 - side * 0.3;
      var a2 = Math.PI / 2 - side * 1.95;
      var fwd = a2 > a1 ? 1 : -1;
      ctx.save();
      ctx.translate(c, c);
      ctx.strokeStyle = C.raised;
      ctx.lineCap = 'round';
      ctx.lineWidth = 6 * k;
      ctx.beginPath();
      ctx.arc(0, 0, R0, a1, a2, fwd < 0);
      ctx.stroke();
      ctx.fillStyle = C.raised;
      var n = 12;
      for (var i = 0; i < n; i++) {
        var t = 0.28 + 0.72 * (i / (n - 1));
        var a = a1 + (a2 - a1) * t;
        var heading = Math.atan2(Math.cos(a) * fwd, -Math.sin(a) * fwd);
        var size = 1 - 0.3 * (i / (n - 1));
        [1, -1].forEach(function (s) {
          ctx.save();
          ctx.translate(Math.cos(a) * (R0 + s * 8 * k), Math.sin(a) * (R0 + s * 8 * k));
          ctx.rotate(heading + s * side * 0.55);
          ctx.beginPath();
          ctx.ellipse(13 * k * size, 0, 16 * k * size, 7 * k * size, 0, 0, Math.PI * 2);
          ctx.fill();
          groove(ctx, C, 2.2 * k);
          ctx.strokeStyle = C.raised;
          ctx.lineWidth = 2 * k;
          ctx.beginPath();
          ctx.moveTo(28 * k * size, 0);
          ctx.lineTo(48 * k * size, 0);
          ctx.stroke();
          ctx.restore();
        });
      }
      ctx.translate(Math.cos(a2) * R0, Math.sin(a2) * R0);
      ctx.rotate(Math.atan2(Math.cos(a2) * fwd, -Math.sin(a2) * fwd));
      ctx.beginPath();
      ctx.ellipse(10 * k, 0, 15 * k, 6.5 * k, 0, 0, Math.PI * 2);
      ctx.fill();
      groove(ctx, C, 2.2 * k);
      ctx.restore();
    }

    // The Indian ₹2 coin in the style of the current steel series: the Lion Capital with
    // सत्यमेव जयते, भारत and INDIA on the obverse; ₹ and 2 among ears of grain on the reverse.
    function drawRupeeFace(ctx, side, mode) {
      var S = ctx.canvas.width, c = S / 2, k = S / 1024;
      var color = mode === 'color';
      var C = color
        ? { raised: '#eef0f1', plate: '#dde0e2', engrave: '#6b7278' }
        : { raised: '#ffffff', plate: '#e0e0e0', engrave: '#7a7a7a' };

      ctx.save();
      ctx.clearRect(0, 0, S, S);
      if (color) {
        var rg = ctx.createRadialGradient(c, c, 430 * k, c, c, 512 * k);
        rg.addColorStop(0, '#99a0a5');
        rg.addColorStop(0.55, '#f0f2f3');
        rg.addColorStop(1, '#8a9196');
        ctx.fillStyle = rg;
      } else {
        ctx.fillStyle = '#f4f4f4';
      }
      ctx.fillRect(0, 0, S, S);
      if (color) {
        var fg = ctx.createRadialGradient(c - 140 * k, c - 170 * k, 40 * k, c, c, RIM);
        fg.addColorStop(0, '#d2d6d9');
        fg.addColorStop(1, '#8c9398');
        ctx.fillStyle = fg;
      } else {
        ctx.fillStyle = '#6a6a6a';
      }
      circlePath(ctx, c, c, RIM);
      ctx.fill();
      for (var i = 0; i < 7000; i++) {
        var a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * (RIM - 4 * k);
        ctx.fillStyle = 'rgba(' + (color || rnd() < 0.5 ? '255,255,255' : '0,0,0') + ',' + (rnd() * 0.08).toFixed(3) + ')';
        ctx.fillRect(c + Math.cos(a) * r, c + Math.sin(a) * r, 2 * k, 2 * k);
      }
      if (color) {
        ctx.shadowColor = 'rgba(30,34,38,0.5)';
        ctx.shadowBlur = 5 * k;
        ctx.shadowOffsetY = 3 * k;
      }
      ctx.strokeStyle = C.raised;
      ctx.lineWidth = 5 * k;
      circlePath(ctx, c, c, 450 * k);
      ctx.stroke();

      var sans = 'Manrope, "Segoe UI", system-ui, sans-serif';
      var deva = '"Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", Mangal, sans-serif';
      ctx.fillStyle = C.raised;
      if (side === 'H') {
        drawLionCapital(ctx, c, c - 60 * k, 1.3 * k, C);
        ctx.fillStyle = C.raised;
        ctx.font = '700 ' + 48 * k + 'px ' + deva;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('सत्यमेव जयते', c, c + 152 * k);
        arcTextAround(ctx, 'भारत', c, c, 396 * k, Math.PI, '700 ' + 64 * k + 'px ' + deva, 0);
        arcTextAround(ctx, 'INDIA', c, c, 396 * k, 0, '800 ' + 60 * k + 'px ' + sans, 14 * k);
      } else {
        drawRupeeSign(ctx, c, c - 186 * k, 116 * k, C);
        ctx.fillStyle = C.raised;
        ctx.font = '800 ' + 330 * k + 'px ' + sans;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('2', c, c + 150 * k);
        drawGrain(ctx, c, k, C, -1);
        drawGrain(ctx, c, k, C, 1);
        ctx.fillStyle = C.raised;
        ctx.font = '700 ' + 44 * k + 'px ' + sans;
        ctx.textBaseline = 'middle';
        ctx.fillText('2024', c, c + 232 * k);
      }
      ctx.restore();
    }

    function makeReeding(mode) {
      var c = makeCanvas(16, 4), g = c.getContext('2d');
      var grd = g.createLinearGradient(0, 0, 16, 0);
      var lo = mode === 'color' ? '#7a8084' : '#404040';
      var hi = mode === 'color' ? '#eceff0' : '#ffffff';
      grd.addColorStop(0, lo); grd.addColorStop(0.5, hi); grd.addColorStop(1, lo);
      g.fillStyle = grd;
      g.fillRect(0, 0, 16, 4);
      var t = new T3.CanvasTexture(c);
      t.wrapS = T3.RepeatWrapping;
      t.repeat.set(150, 1);
      if (mode === 'color') t.encoding = T3.sRGBEncoding;
      return t;
    }

    // Each coin design gets its own face textures and edge, made the first time it is used.
    var COIN_TYPES = {
      cricket: {
        label: 'Cricket coin', draw: drawFace, roughness: 0.3, bumpScale: 0.022,
        sides: { H: 'Crossed bats side up', T: 'Stumps side up' },
        edge: function () {
          return new T3.MeshStandardMaterial({ map: makeReeding('color'), bumpMap: makeReeding('bump'), bumpScale: 0.015, metalness: 1, roughness: 0.36 });
        }
      },
      rupee2: {
        label: '₹2 coin', draw: drawRupeeFace, roughness: 0.4, bumpScale: 0.026,
        sides: { H: 'Lion Capital side up', T: '₹2 side up' },
        edge: function () {
          return new T3.MeshStandardMaterial({ color: 0xc9cdd1, metalness: 1, roughness: 0.32 });
        }
      }
    };
    var coinSets = {};
    function paintSet(type) {
      var set = coinSets[type], draw = COIN_TYPES[type].draw;
      ['H', 'T'].forEach(function (side) {
        var f = set.faces[side];
        draw(f.colorCanvas.getContext('2d'), side, 'color');
        draw(f.bumpCanvas.getContext('2d'), side, 'bump');
        f.map.needsUpdate = true;
        f.bump.needsUpdate = true;
      });
    }
    function coinSet(type) {
      if (coinSets[type]) return coinSets[type];
      var spec = COIN_TYPES[type], set = { faces: {}, edge: spec.edge() };
      ['H', 'T'].forEach(function (side) {
        var colorCanvas = makeCanvas(Q.faceTex, Q.faceTex), bumpCanvas = makeCanvas(Q.faceTex, Q.faceTex);
        var map = new T3.CanvasTexture(colorCanvas);
        map.encoding = T3.sRGBEncoding;
        map.anisotropy = maxAniso;
        var bump = new T3.CanvasTexture(bumpCanvas);
        bump.anisotropy = maxAniso;
        set.faces[side] = {
          colorCanvas: colorCanvas, bumpCanvas: bumpCanvas, map: map, bump: bump,
          material: new T3.MeshStandardMaterial({ map: map, bumpMap: bump, bumpScale: spec.bumpScale, metalness: 1, roughness: spec.roughness })
        };
      });
      coinSets[type] = set;
      paintSet(type);
      return set;
    }
    function repaintCoins() {
      Object.keys(coinSets).forEach(paintSet);
    }
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('800 64px Manrope'),
        document.fonts.load('700 64px "Noto Sans Devanagari"', 'भारत')
      ]).then(repaintCoins, repaintCoins);
    }

    var coin = new T3.Group();
    var edgeMesh = new T3.Mesh(new T3.CylinderGeometry(R, R, TH, 128, 1, true));
    var headsMesh = new T3.Mesh(new T3.CircleGeometry(R, 128));
    headsMesh.rotation.x = -Math.PI / 2;
    headsMesh.position.y = TH / 2;
    var tailsMesh = new T3.Mesh(new T3.CircleGeometry(R, 128));
    tailsMesh.rotation.x = Math.PI / 2;
    tailsMesh.position.y = -TH / 2;
    [edgeMesh, headsMesh, tailsMesh].forEach(function (m) { m.castShadow = true; coin.add(m); });
    scene.add(coin);
    function applyCoin(type) {
      var set = coinSet(type);
      headsMesh.material = set.faces.H.material;
      tailsMesh.material = set.faces.T.material;
      edgeMesh.material = set.edge;
      // Free the other design's textures; it is drawn again if it is picked again.
      Object.keys(coinSets).forEach(function (other) {
        if (other === type) return;
        var old = coinSets[other];
        ['H', 'T'].forEach(function (side) {
          old.faces[side].map.dispose();
          old.faces[side].bump.dispose();
          old.faces[side].material.dispose();
        });
        if (old.edge.map) old.edge.map.dispose();
        if (old.edge.bumpMap) old.edge.bumpMap.dispose();
        old.edge.dispose();
        delete coinSets[other];
      });
    }
    applyCoin(state.coin);

    /* ================= Table, lamp, atmosphere ================= */
    var TABLE_R = 24;
    var LAMP_Y = 58;
    var tableWorld = new T3.Group();
    scene.add(tableWorld);

    function makeWood() {
      var S = 1024, c = makeCanvas(S, S), g = c.getContext('2d');
      g.fillStyle = '#3b2517';
      g.fillRect(0, 0, S, S);
      for (var i = 0; i < 16; i++) {
        var y = rnd() * S, h = 40 + rnd() * 140;
        var grd = g.createLinearGradient(0, y, 0, y + h);
        var tone = rnd() < 0.5 ? '90,58,34' : '28,16,9';
        grd.addColorStop(0, 'rgba(' + tone + ',0)');
        grd.addColorStop(0.5, 'rgba(' + tone + ',' + (0.12 + rnd() * 0.2).toFixed(2) + ')');
        grd.addColorStop(1, 'rgba(' + tone + ',0)');
        g.fillStyle = grd;
        g.fillRect(0, y, S, h);
      }
      for (var j = 0; j < 460; j++) {
        var y0 = rnd() * S, amp = 2 + rnd() * 10, freq = (1 + Math.floor(rnd() * 3)) * Math.PI * 2 / S, ph = rnd() * 6.28;
        g.strokeStyle = rnd() < 0.62
          ? 'rgba(20,11,5,' + (0.15 + rnd() * 0.35).toFixed(2) + ')'
          : 'rgba(118,78,46,' + (0.06 + rnd() * 0.14).toFixed(2) + ')';
        g.lineWidth = 0.6 + rnd() * 2.2;
        [-S, 0, S].forEach(function (shift) {
          g.beginPath();
          for (var x = 0; x <= S; x += 16) {
            var yy = y0 + shift + Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 3 + ph * 2) * amp * 0.25;
            if (x) g.lineTo(x, yy); else g.moveTo(x, yy);
          }
          g.stroke();
        });
      }
      var t = new T3.CanvasTexture(c);
      t.encoding = T3.sRGBEncoding;
      t.wrapS = t.wrapT = T3.RepeatWrapping;
      t.repeat.set(2, 2);
      t.anisotropy = maxAniso;
      return t;
    }

    var tableTop = new T3.Mesh(
      new T3.CircleGeometry(TABLE_R, 128),
      // Phong: the same lamplit wood, without a reflection lookup at every pixel of the table.
      new T3.MeshPhongMaterial({ map: makeWood(), shininess: 10, specular: 0x21180f })
    );
    tableTop.rotation.x = -Math.PI / 2;
    tableWorld.add(tableTop);
    // Only a small patch under the coin takes shadows, so the table and the pitch aren't
    // shadow-sampled across the whole screen every frame.
    function makeShadowCatcher(size, opacity) {
      var m = new T3.Mesh(new T3.PlaneGeometry(size, size),
        new T3.ShadowMaterial({ opacity: opacity, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }));
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.01;
      m.receiveShadow = true;
      return m;
    }
    var tableCatcher = makeShadowCatcher(9, 0.55);
    tableWorld.add(tableCatcher);
    var tableEdge = new T3.Mesh(
      new T3.CylinderGeometry(TABLE_R, TABLE_R - 0.5, 2.2, 128, 1, true),
      new T3.MeshLambertMaterial({ color: 0x22150c })
    );
    tableEdge.position.y = -1.1;
    tableWorld.add(tableEdge);

    var spot = new T3.SpotLight(0xffd6a0, 2.3, 0, 0.39, 0.6, 1);
    spot.position.set(0, LAMP_Y - 1, 0);
    spot.target.position.set(0, 0, 0);
    spot.castShadow = true;
    spot.shadow.mapSize.set(Q.shadow, Q.shadow);
    spot.shadow.camera.near = 18;
    spot.shadow.camera.far = 70;
    spot.shadow.bias = -0.0004;
    tableWorld.add(spot, spot.target);
    tableWorld.add(new T3.HemisphereLight(0x456a74, 0x1a0f08, 0.45));
    var rim = new T3.DirectionalLight(0x9fc4d6, 0.7);
    rim.position.set(-6, 14, -14);
    tableWorld.add(rim);

    function makeGlow() {
      var c = makeCanvas(64, 64), g = c.getContext('2d');
      var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.35, 'rgba(255,255,255,0.5)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 64, 64);
      return new T3.CanvasTexture(c);
    }
    var glowTex = makeGlow();

    // Pendant lamp overhead: the coin flies up toward it.
    var lamp = new T3.Group();
    lamp.position.y = LAMP_Y;
    var shade = new T3.Mesh(
      new T3.CylinderGeometry(1.6, 4.4, 3.4, 48, 1, true),
      new T3.MeshStandardMaterial({ color: 0x1d2b2b, metalness: 0.7, roughness: 0.35, side: T3.DoubleSide })
    );
    lamp.add(shade);
    var bulb = new T3.Mesh(new T3.SphereGeometry(1.2, 24, 16), new T3.MeshBasicMaterial({ color: new T3.Color(0xfff0d0).multiplyScalar(2.2), fog: false }));
    bulb.position.y = -0.9;
    lamp.add(bulb);
    var cord = new T3.Mesh(new T3.CylinderGeometry(0.08, 0.08, 80, 8), new T3.MeshStandardMaterial({ color: 0x111616 }));
    cord.position.y = 41.7;
    lamp.add(cord);
    var halo = new T3.Sprite(new T3.SpriteMaterial({ map: glowTex, color: 0xffcf8a, blending: T3.AdditiveBlending, depthWrite: false, fog: false, transparent: true, opacity: 0.85 }));
    halo.scale.set(12, 12, 1);
    halo.position.y = -1.4;
    lamp.add(halo);
    tableWorld.add(lamp);

    // Visible beam of light from the lamp to the table.
    var coneH = LAMP_Y - 1, coneR = TABLE_R - 2;
    var beam = new T3.Mesh(
      new T3.ConeGeometry(coneR, coneH, 64, 1, true),
      new T3.ShaderMaterial({
        uniforms: { uColor: { value: new T3.Color(0xffc978) }, uStrength: { value: 0.13 } },
        vertexShader: [
          'varying vec3 vN; varying vec3 vView; varying float vH;',
          'void main(){',
          '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
          '  vView = -mv.xyz; vN = normalMatrix * normal; vH = uv.y;',
          '  gl_Position = projectionMatrix * mv;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform vec3 uColor; uniform float uStrength;',
          'varying vec3 vN; varying vec3 vView; varying float vH;',
          'void main(){',
          '  float f = pow(abs(dot(normalize(vN), normalize(vView))), 2.0);',
          '  float a = f * uStrength * mix(0.3, 1.0, vH);',
          '  gl_FragColor = vec4(uColor * a, 1.0);',
          '}'
        ].join('\n'),
        transparent: true,
        blending: T3.AdditiveBlending,
        depthWrite: false,
        side: T3.DoubleSide
      })
    );
    beam.position.y = coneH / 2;
    tableWorld.add(beam);

    // Dust motes: they stream past as the camera rides up with the coin.
    var DUST = reduceMotion ? 200 : Q.dust;
    var dustPos = new Float32Array(DUST * 3);
    var dustCol = new Float32Array(DUST * 3);
    var dustVel = new Float32Array(DUST);
    for (var d = 0; d < DUST; d++) {
      var dr = Math.sqrt(rnd()) * 30, da = rnd() * Math.PI * 2, dy = 0.4 + rnd() * 60;
      dustPos[d * 3] = Math.cos(da) * dr;
      dustPos[d * 3 + 1] = dy;
      dustPos[d * 3 + 2] = Math.sin(da) * dr;
      var coneAt = coneR * (1 - dy / coneH);
      var lit = dr < coneAt ? 1 : Math.max(0.12, 1 - (dr - coneAt) / 6);
      var tint = 0.75 + rnd() * 0.25;
      dustCol[d * 3] = lit * tint;
      dustCol[d * 3 + 1] = lit * tint * 0.82;
      dustCol[d * 3 + 2] = lit * tint * 0.58;
      dustVel[d] = 0.03 + rnd() * 0.12;
    }
    var dustGeo = new T3.BufferGeometry();
    dustGeo.setAttribute('position', new T3.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('color', new T3.BufferAttribute(dustCol, 3));
    var dust = new T3.Points(dustGeo, new T3.PointsMaterial({
      size: 0.07, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: T3.AdditiveBlending, sizeAttenuation: true
    }));
    tableWorld.add(dust);

    // Far-off room lights, out of focus.
    for (var bk = 0; bk < Q.bokeh; bk++) {
      var ba = rnd() * Math.PI * 2, brad = 85 + rnd() * 50;
      var bokeh = new T3.Sprite(new T3.SpriteMaterial({
        map: glowTex,
        color: [0xf4b860, 0x6fa8a0, 0xe8dcc0, 0xd98a52][bk % 4],
        blending: T3.AdditiveBlending, depthWrite: false, fog: false, transparent: true,
        opacity: 0.1 + rnd() * 0.22
      }));
      var bs = 3 + rnd() * 8;
      bokeh.scale.set(bs, bs, 1);
      bokeh.position.set(Math.cos(ba) * brad, -15 + rnd() * 80, Math.sin(ba) * brad);
      tableWorld.add(bokeh);
    }

    /* ================= Cricket ground, daytime ================= */
    // Built to real measurements, in coin units: 1 m = 83.3 units.
    var M = 1 / 0.012;

    // Draws something at every tile offset so a texture repeats without seams.
    function wrap9(S, fn) {
      for (var dx = -S; dx <= S; dx += S) for (var dy = -S; dy <= S; dy += S) fn(dx, dy);
    }

    // Close-up detail for the pitch: dry, rolled clay, dead grass and hairline cracks.
    function makePitchDetail() {
      var S = 512, c = makeCanvas(S, S), g = c.getContext('2d');
      g.fillStyle = '#b39a6a';
      g.fillRect(0, 0, S, S);
      for (var i = 0; i < 90; i++) {
        var x = rnd() * S, y = rnd() * S, r = 20 + rnd() * 70;
        var tone = rnd() < 0.5 ? '170,144,96' : '220,202,158';
        var a = (0.18 + rnd() * 0.22).toFixed(2);
        wrap9(S, function (dx, dy) {
          var grd = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
          grd.addColorStop(0, 'rgba(' + tone + ',' + a + ')');
          grd.addColorStop(1, 'rgba(' + tone + ',0)');
          g.fillStyle = grd;
          g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
        });
      }
      for (var j = 0; j < 42000; j++) {
        var v = rnd();
        g.fillStyle = v < 0.45 ? 'rgba(120,96,58,0.35)' : v < 0.9 ? 'rgba(236,222,186,0.3)' : 'rgba(90,86,80,0.35)';
        g.fillRect(rnd() * S, rnd() * S, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
      }
      g.lineCap = 'round';
      g.lineWidth = 1;
      for (var q = 0; q < 900; q++) {
        var gx = rnd() * S, gy = rnd() * S, ga = rnd() * Math.PI, gl = 3 + rnd() * 6;
        g.strokeStyle = rnd() < 0.5 ? 'rgba(142,150,74,0.4)' : 'rgba(176,160,96,0.4)';
        g.beginPath();
        g.moveTo(gx, gy);
        g.lineTo(gx + Math.cos(ga) * gl, gy + Math.sin(ga) * gl);
        g.stroke();
      }
      for (var n = 0; n < 9; n++) {
        var pts = [[rnd() * S, rnd() * S]], ang = rnd() * Math.PI * 2;
        for (var st = 0; st < 10; st++) {
          ang += (rnd() - 0.5) * 1.2;
          var last = pts[pts.length - 1];
          pts.push([last[0] + Math.cos(ang) * (8 + rnd() * 14), last[1] + Math.sin(ang) * (8 + rnd() * 14)]);
        }
        g.strokeStyle = 'rgba(104,82,50,0.45)';
        g.lineWidth = 1 + rnd() * 0.8;
        wrap9(S, function (dx, dy) {
          g.beginPath();
          pts.forEach(function (p, m) { if (m) g.lineTo(p[0] + dx, p[1] + dy); else g.moveTo(p[0] + dx, p[1] + dy); });
          g.stroke();
        });
      }
      var t = new T3.CanvasTexture(c);
      t.encoding = T3.sRGBEncoding;
      t.wrapS = t.wrapT = T3.RepeatWrapping;
      t.anisotropy = maxAniso;
      return t;
    }

    // The outfield: mowing stripes, the square, and the fielding circle.
    function makeOutfield(radius, stumpsZ) {
      var S = Q.fieldTex, c = makeCanvas(S, S), g = c.getContext('2d');
      var px = S / (radius * 2), cx = S / 2, cy = S / 2;
      g.fillStyle = '#5c9a40';
      g.fillRect(0, 0, S, S);
      var band = 4.5 * M * px;
      for (var i = 0, x = cx - band / 2 - band * 20; x < S; x += band, i++) {
        g.fillStyle = i % 2 ? 'rgba(236,255,200,0.08)' : 'rgba(18,54,12,0.08)';
        g.fillRect(x, 0, band, S);
      }
      for (var j = 0, dots = 70000 * (S / 2048) * (S / 2048); j < dots; j++) {
        g.fillStyle = rnd() < 0.5 ? 'rgba(28,66,18,0.2)' : 'rgba(176,214,122,0.14)';
        g.fillRect(rnd() * S, rnd() * S, 2, 2);
      }
      g.fillStyle = 'rgba(206,222,150,0.16)';
      g.fillRect(cx - 12 * M * px, cy - 16 * M * px, 24 * M * px, 32 * M * px);
      // Two 30-yard arcs around the stumps, joined by straight lines.
      var rr = 27.43 * M * px, sz = stumpsZ * px;
      g.strokeStyle = 'rgba(255,255,255,0.8)';
      g.lineWidth = 2.5;
      g.setLineDash([1.1 * M * px, 0.9 * M * px]);
      g.beginPath();
      g.arc(cx, cy - sz, rr, Math.PI, 0);
      g.lineTo(cx + rr, cy + sz);
      g.arc(cx, cy + sz, rr, 0, Math.PI);
      g.closePath();
      g.stroke();
      g.setLineDash([]);
      var edge = g.createRadialGradient(cx, cy, (radius - 7 * M) * px, cx, cy, radius * px);
      edge.addColorStop(0, 'rgba(126,112,70,0)');
      edge.addColorStop(1, 'rgba(126,112,70,0.4)');
      g.fillStyle = edge;
      g.fillRect(0, 0, S, S);
      var t = new T3.CanvasTexture(c);
      t.encoding = T3.sRGBEncoding;
      t.anisotropy = maxAniso;
      return t;
    }

    // A packed crowd, mostly in blue, row after row, with aisles.
    function makeCrowd(shaded) {
      var W = 1024, H = 512, c = makeCanvas(W, H), g = c.getContext('2d');
      g.fillStyle = '#566072';
      g.fillRect(0, 0, W, H);
      var rows = 28, rowH = H / rows;
      var shirts = ['#1f5fd0', '#2d74e8', '#1a4fb8', '#3b82f6', '#f28c28', '#f5f5f0', '#ffd23f', '#1f8a4c', '#d7263d', '#2b2b2b'];
      var skin = ['#8d5a3b', '#a8714a', '#c68c5e', '#6e4630'];
      for (var r = 0; r < rows; r++) {
        var y = r * rowH;
        g.fillStyle = 'rgba(0,0,0,0.28)';
        g.fillRect(0, y + rowH - 3, W, 3);
        for (var x = 2; x < W - 6; x += 7 + rnd() * 3) {
          if (x % 128 < 12 || rnd() < 0.1) continue;
          g.fillStyle = shirts[(rnd() * shirts.length) | 0];
          g.fillRect(x, y + 5, 6, rowH - 8);
          g.fillStyle = skin[(rnd() * skin.length) | 0];
