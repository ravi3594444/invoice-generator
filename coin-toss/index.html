      var g = (8 * H) / (T * T);
      var v0 = (yTouch - y0 + 0.5 * g * T * T) / T;
      var whole = reduceMotion ? 3 + Math.floor(rnd() * 2) : 7 + Math.floor(rnd() * 3);
      var fromBase = rest.theta;            // 0 (heads up) or PI (tails up)
      var aimBase = aimFace === 'H' ? 0 : Math.PI;
      var extra = fromBase === aimBase ? 0 : Math.PI;
      var thetaFinal = fromBase + whole * Math.PI * 2 + extra;
      var psiF = (rnd() - 0.5) * 0.7;
      var ang = rnd() * Math.PI * 2, rad = rnd() * 1.4;
      toss = {
        face: face,
        H: H, T: T, g: g, v0: v0, y0: y0,
        sx: rest.pos.x, sz: rest.pos.z,
        ex: rest.pos.x * 0.35 + Math.cos(ang) * rad,
        ez: rest.pos.z * 0.35 + Math.sin(ang) * rad,
        theta0: fromBase, thetaFinal: thetaFinal, thetaTouch: thetaFinal - d1,
        turns: whole + extra / (Math.PI * 2),
        psi0: rest.psi, psiF: psiF, yawWob: (rnd() - 0.5) * 1.2,
        beta: (rnd() < 0.5 ? -1 : 1) * (0.16 + rnd() * 0.14),
        orbitDir: rnd() < 0.5 ? -1 : 1,
        d1: d1, d2: d2, hop: 0.45 + rnd() * 0.4, Tc: 0.3, Td: 1.6,
        wdir: rnd() < 0.5 ? -1 : 1, K: 7.5, phi0: Math.PI - psiF, tickIdx: 0,
        qFinal: flipQuat(new T3.Quaternion(), psiF, 0, face === 'H' ? 0 : Math.PI)
      };
      if (suspense) {
        var fake = rnd() < 0.4;
        var thetaE = thetaFinal - Math.PI / 2;   // stands up on the edge it lands on
        var sigma = face === aimFace ? 1 : -1;   // tips forward onto the aimed face, or back onto the other
        var w1 = 4 + rnd() * 1.5;
        var alpha0 = 0.3;
        toss.susp = {
          Tup: 0.45, Tspin: 1.3 + rnd() * 0.6, Troll: fake ? 1.6 : 1.05, Tw: 1.35,
          thetaE: thetaE, sigma: sigma, betaF: thetaE + sigma * Math.PI / 2, fake: fake,
          w0: 13 + rnd() * 4, w1: w1, rate0: w1 / Math.sqrt(Math.sin(alpha0)),
          spinDir: rnd() < 0.5 ? -1 : 1, lean: 0.06 + rnd() * 0.05, alpha0: alpha0
        };
        toss.post = { phi: 0, beta: 0, psi: 0, rate: 0, tickAcc: 0, beatT: 0.2, beatGap: 0.86 };
      }
      phase = 'flight';
      phaseT = 0;
      soundFlick();
      onLaunchUI();
    }

    function impact(k) {
      if (!reduceMotion) shake = Math.max(shake, 0.16 * k);
      soundClink(k);
      try { if (navigator.vibrate) navigator.vibrate(k > 0.8 ? 16 : 8); } catch (e) { /* no haptics */ }
    }

    function settle() {
      phase = 'idle';
      rest.pos.set(toss.ex, REST_Y, toss.ez);
      rest.theta = toss.face === 'H' ? 0 : Math.PI;
      rest.psi = toss.psiF;
      coin.position.copy(rest.pos);
      coin.quaternion.copy(toss.qFinal);
      setWhoosh(0, 600);
      soundSettle();
      if (toss.susp) {
        document.body.classList.remove('tense');
        soundReveal();
      }
      onResultUI(toss);
    }

    // Angle between the coin and the table, whichever face is up.
    function flatTilt(beta) {
      var m = ((beta % Math.PI) + Math.PI) % Math.PI;
      return Math.min(m, Math.PI - m);
    }
    // Height of the centre with the lowest point of the rim on the table.
    function bodyY(beta) {
      return R * Math.abs(Math.sin(beta)) + (TH / 2) * Math.abs(Math.cos(beta));
    }
    // Orientation of a coin rolling on its rim: turn about the vertical (phi),
    // tip over (beta, 0 = heads up, PI = tails up), turn about its own face (psi).
    function rollQuat(out, phi, beta, psi) {
      out.setFromAxisAngle(AY, phi);
      qTmp.setFromAxisAngle(AX, beta);
      out.multiply(qTmp);
      qTmp2.setFromAxisAngle(AY, psi);
      out.multiply(qTmp2);
      return out;
    }

    function updateSuspense(dt, P, Q) {
      var S = toss.susp, st = toss.post, s;
      P.x = toss.ex;
      P.z = toss.ez;
      if (phase === 'stand') {
        // Bounces off the edge it landed on, pops up onto it and starts to spin.
        s = phaseT / S.Tup;
        st.beta = lerp(toss.thetaTouch, S.thetaE, easeOutCubic(s));
        st.rate = S.spinDir * lerp(1.5, S.w0, smooth01(s));
        P.y = bodyY(st.beta) + 0.35 * 4 * s * (1 - s);
      } else if (phase === 'spin') {
        // Spins on its edge and slows down while both faces flash past.
        s = phaseT / S.Tspin;
        st.rate = S.spinDir * (S.w1 + (S.w0 - S.w1) * Math.pow(1 - s, 1.4));
        var lean = S.fake ? 0 : S.sigma * S.lean * smooth01(s);
        st.beta = S.thetaE + lean + 0.035 * Math.sin(phaseT * 19) * (1 - s);
        P.y = bodyY(st.beta);
      } else if (phase === 'roll') {
        // Tips over, rolling on its rim. Sometimes it teeters the wrong way first.
        s = phaseT / S.Troll;
        var from = S.thetaE + (S.fake ? 0 : S.sigma * S.lean);
        var to = S.betaF - S.sigma * S.alpha0;
        if (S.fake) {
          var wrong = S.thetaE - S.sigma * 0.42;
          st.beta = s < 0.45
            ? lerp(from, wrong, smooth01(s / 0.45))
            : lerp(wrong, to, Math.pow((s - 0.45) / 0.55, 2));
        } else {
          st.beta = lerp(from, to, s * s);
        }
        st.rate = S.spinDir * S.w1 / Math.sqrt(Math.max(Math.sin(flatTilt(st.beta)), 0.2));
        P.y = bodyY(st.beta);
      } else {
        // The last rattle: flatter and flatter, faster and faster.
        s = phaseT / S.Tw;
        var alpha = S.alpha0 * Math.pow(1 - s, 1.6);
        st.beta = S.betaF - S.sigma * alpha;
        st.rate = S.spinDir * Math.min(140, S.rate0 * Math.sqrt(S.alpha0 / Math.max(alpha, 0.002)));
        P.y = bodyY(st.beta);
      }
      st.phi += st.rate * dt;
      st.psi -= st.rate * Math.cos(st.beta) * dt;   // rolls on its rim without slipping
      if (phase === 'rattle') {
        // Ease the face round so it reads upright once it lies flat.
        var up = toss.face === 'H' ? 1 : -1;
        var err = toss.psiF - (st.phi + up * st.psi);
        err = Math.atan2(Math.sin(err), Math.cos(err));
        st.psi += up * Math.max(-2.5 * dt, Math.min(2.5 * dt, err * (1 - Math.exp(-4 * dt))));
      }
      rollQuat(Q, st.phi, st.beta, st.psi);
      suspenseSound(dt);
    }

    var lastTickAt = 0;
    function suspenseSound(dt) {
      var S = toss.susp, st = toss.post;
      var rate = Math.abs(st.rate);
      var step = phase === 'stand' || phase === 'spin' ? Math.PI : Math.PI / 2;
      st.tickAcc += rate * dt;
      var crossed = st.tickAcc >= step;
      if (crossed) st.tickAcc %= step;
      // At most one tick every 35 ms; any faster just piles up audio work.
      if (crossed && clock - lastTickAt >= 0.035) {
        lastTickAt = clock;
        var tilt = flatTilt(st.beta);
        if (phase === 'rattle') soundTick(0.3 + 0.7 * tilt / S.alpha0, 1.4 + 0.6 * (1 - tilt / S.alpha0));
        else if (phase === 'roll') soundTick(0.75, 1 + 0.4 * (1 - tilt / (Math.PI / 2)));
        else soundTick(0.4, 0.85);
      }
      setWhoosh(phase === 'rattle' ? 0.014 * (1 - phaseT / S.Tw) : 0.014, 2200 + Math.min(rate, 60) * 35);
      if (phase === 'spin' || phase === 'roll') {
        st.beatT -= dt;
        if (st.beatT <= 0) {
          soundHeartbeat();
          st.beatT += st.beatGap;
          st.beatGap = Math.max(0.56, st.beatGap * 0.93);
        }
      }
    }

    function updateCoin(dt) {
      if (phase === 'idle') return;
      phaseT += dt;
      var S = toss.susp;
      if (phase === 'flight' && phaseT >= toss.T) {
        phaseT -= toss.T;
        impact(1);
        setWhoosh(0, 600);
        if (S) {
          phase = 'stand';
          toss.post.phi = toss.psiF;
          toss.post.beta = toss.thetaTouch;
          toss.post.psi = 0;
          onSuspenseUI();
        } else {
          phase = 'hop';
        }
      }
      if (phase === 'hop' && phaseT >= toss.Tc) { phaseT -= toss.Tc; phase = 'wobble'; impact(0.4); }
      if (phase === 'wobble' && phaseT >= toss.Td) { settle(); return; }
      if (phase === 'stand' && phaseT >= S.Tup) { phaseT -= S.Tup; phase = 'spin'; soundClink(0.3); }
      if (phase === 'spin' && phaseT >= S.Tspin) { phaseT -= S.Tspin; phase = 'roll'; }
      if (phase === 'roll' && phaseT >= S.Troll) { phaseT -= S.Troll; phase = 'rattle'; }
      if (phase === 'rattle' && phaseT >= S.Tw) { settle(); return; }

      var P = coin.position, Q = coin.quaternion, s;
      if (phase === 'flight') {
        var t = phaseT;
        s = t / toss.T;
        P.x = lerp(toss.sx, toss.ex, s);
        P.z = lerp(toss.sz, toss.ez, s);
        P.y = toss.y0 + toss.v0 * t - 0.5 * toss.g * t * t;
        var theta = lerp(toss.theta0, toss.thetaTouch, s);
        var psi = lerp(toss.psi0, toss.psiF, smooth01(s)) + toss.yawWob * Math.sin(Math.PI * s);
        flipQuat(Q, psi, toss.beta * Math.sin(Math.PI * s), theta);
        var edgeOn = Math.abs(Math.sin(theta));
        var env = Math.pow(Math.sin(Math.PI * Math.min(1, s * 1.05)), 0.6);
        setWhoosh(0.05 * env * (0.3 + 0.7 * edgeOn), 600 + 1300 * edgeOn);
      } else if (phase === 'hop') {
        s = phaseT / toss.Tc;
        var tilt = lerp(toss.d1, toss.d2, easeOutCubic(s));
        P.set(toss.ex, contactY(tilt) + toss.hop * 4 * s * (1 - s), toss.ez);
        flipQuat(Q, toss.psiF, 0, toss.thetaFinal - tilt);
      } else if (phase === 'wobble') {
        // Settles like a spun coin: the tilt shrinks while the rocking speeds up.
        s = phaseT / toss.Td;
        var alpha = toss.d2 * Math.pow(1 - s, 1.6);
        var prog = -Math.log(1 - 0.985 * s);
        var phi = toss.phi0 + toss.wdir * toss.K * prog;
        P.set(toss.ex, contactY(alpha), toss.ez);
        axisTmp.set(Math.cos(phi), 0, Math.sin(phi));
        Q.setFromAxisAngle(axisTmp, alpha).multiply(toss.qFinal);
        var idx = Math.floor((toss.K * prog) / (Math.PI / 2));
        if (idx > toss.tickIdx) {
          toss.tickIdx = idx;
          soundTick(alpha / toss.d2, 1 + s * 0.6);
        }
      } else {
        updateSuspense(dt, P, Q);
      }
    }

    /* ================= Camera: rides up with the coin ================= */
    var camPos = new T3.Vector3(), camLook = new T3.Vector3(), wantPos = new T3.Vector3(), wantLook = new T3.Vector3();
    var lowPos = new T3.Vector3(), highPos = new T3.Vector3();
    var camFov = 42;
    var clock = 0;
    var tension = 0;

    function framing() { return Math.max(1, 0.78 / camera.aspect); }
    function baseFov() { return camera.aspect < 1 ? 48 : 40; }

    function updateCamera(dt) {
      var f = framing();
      var c = coin.position;
      var rateP, rateL, fov = baseFov();
      if (reduceMotion) {
        wantPos.set(rest.pos.x, 7.5 * f, rest.pos.z + 9 * f);
        wantLook.set(rest.pos.x, phase === 'idle' ? 0.2 : 2.6, rest.pos.z + 0.4 * f);
        rateP = 2; rateL = 3;
      } else if (phase === 'flight') {
        var s = phaseT / toss.T;
        var orbit = toss.orbitDir * 0.95 * Math.sin(Math.PI * s);
        var dist = (4.6 + 1.4 * Math.sin(Math.PI * s)) * f;
        var yOff = lerp(-1.8, 2.8, smoothRange(0.3, 0.8, s));
        wantPos.set(c.x + Math.sin(orbit) * dist, c.y + yOff, c.z + Math.cos(orbit) * dist);
        wantLook.copy(c);
        rateP = activeWorld.flightRate; rateL = 22; fov += 10;
      } else if (phase === 'stand' || phase === 'spin' || phase === 'roll') {
        // Down at table level, where nobody can tell which way it will fall.
        var S = toss.susp;
        var rise = phase === 'roll' ? smoothRange(0.62, 1, phaseT / S.Troll) : 0;
        var push = phase === 'spin' ? smooth01(phaseT / S.Tspin) : (phase === 'roll' ? 1 : 0);
        var az = 0.22 * Math.sin(clock * 0.45);
        var D = (6.2 - 1.1 * push) * f;
        lowPos.set(c.x + Math.sin(az) * D, 1.15, c.z + Math.cos(az) * D);
        highPos.set(c.x, 3.8 * f, c.z + 3.6 * f);
        wantPos.copy(lowPos).lerp(highPos, rise);
        wantLook.set(c.x, lerp(0.85, 0.1, rise), c.z + 0.3 * f * rise);
        rateP = phase === 'stand' ? 3 : 2.4; rateL = 6;
      } else if (phase === 'hop' || phase === 'wobble' || phase === 'rattle') {
        wantPos.set(c.x, 3.8 * f, c.z + 3.6 * f);
        wantLook.set(c.x, 0.1, c.z + 0.3 * f);
        rateP = 3.2; rateL = 8; fov += 2;
      } else {
        wantPos.set(c.x + Math.sin(clock * 0.25) * 0.25, 5.2 * f, c.z + 3.9 * f);
        wantLook.set(c.x, 0.1, c.z + 0.55 * f);
        rateP = 1.8; rateL = 3;
      }
      camPos.lerp(wantPos, 1 - Math.exp(-rateP * dt));
      camLook.lerp(wantLook, 1 - Math.exp(-rateL * dt));
      if (camPos.y < 0.7) camPos.y = 0.7;
      camFov += (fov - camFov) * (1 - Math.exp(-3 * dt));
      camera.position.copy(camPos);
      if (shake > 0.0005) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
        camera.position.z += (Math.random() - 0.5) * shake;
        shake *= Math.exp(-dt * 9);
      }
      camera.fov = camFov;
      camera.updateProjectionMatrix();
      camera.lookAt(camLook);
    }

    function updateDust(dt) {
      var arr = dustGeo.attributes.position.array;
      for (var i = 0; i < DUST; i++) {
        var y = arr[i * 3 + 1] + dustVel[i] * dt;
        arr[i * 3 + 1] = y > 60.4 ? 0.4 : y;
      }
      dustGeo.attributes.position.needsUpdate = true;
      dust.rotation.y += dt * 0.012;
    }

    /* ================= Resize & loop ================= */
    function resize() {
      var w = window.innerWidth || 1, h = window.innerHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    var perf = { t: 0, n: 0, warm: 2 };

    // Open on a slow settle into the resting view.
    camFov = baseFov();
    setScene(state.scene, true);
    renderer.compile(scene, camera);

    var last = performance.now();
    var rafId = 0, looping = false, glLost = false, lostFor = 0;

    function frame(now) {
      var real = Math.max(0, (now - last) / 1000);
      var dt = Math.min(0.05, real);
      last = now;
      if (glLost) {
        // The GPU dropped the page's graphics. If they don't come back, start afresh
        // (the tally is saved).
        lostFor += real;
        if (lostFor > 3) location.reload();
        return;
      }
      clock += dt;
      updateCoin(dt);
      updateCamera(dt);
      if (activeWorld.update) activeWorld.update(dt);
      // While the coin spins on its edge: the room dims, the beam brightens and the coin
      // catches more light, so you can read each face as it turns past.
      var tenseNow = phase === 'stand' || phase === 'spin' || phase === 'roll';
      tension += ((tenseNow ? 1 : 0) - tension) * (1 - Math.exp(-2.5 * dt));
      renderer.toneMappingExposure = activeWorld.exposure - 0.14 * tension;
      beam.material.uniforms.uStrength.value = 0.13 + 0.08 * tension;
      headsMesh.material.envMapIntensity = tailsMesh.material.envMapIntensity = 1 + 0.7 * tension;
      renderer.render(scene, camera);
      tuneResolution(real);
    }

    // If frames take longer than 20 ms (under 50 fps), draw fewer pixels. It only ever
    // steps down, so it never flip-flops between sizes.
    function tuneResolution(real) {
      if (perf.warm > 0) {
        perf.warm -= real;
        return;
      }
      if (real > 0.25) return;   // a one-off hitch, not the device's pace
      perf.t += real;
      perf.n += 1;
      if (perf.t < 2) return;
      var avg = perf.t / perf.n;
      perf.t = 0;
      perf.n = 0;
      if (avg > 1 / 50 && pixelRatio > 0.75) {
        pixelRatio = Math.max(0.75, pixelRatio - 0.25);
        renderer.setPixelRatio(pixelRatio);
        resize();
      }
    }

    function loop(now) {
      rafId = requestAnimationFrame(loop);   // queue the next frame first, so one error can't freeze the app
      try {
        frame(now);
      } catch (e) {
        if (window.console) console.error(e);
      }
    }
    function startLoop() {
      if (looping) return;
      looping = true;
      last = performance.now();
      rafId = requestAnimationFrame(loop);
    }
    function stopLoop() {
      looping = false;
      cancelAnimationFrame(rafId);
    }
    function quietly(promise) {
      if (promise && promise.catch) promise.catch(function () {});
    }

    // Leaving the app mid-toss: stop drawing and silence the sound, then carry on from
    // the same moment when it comes back.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        stopLoop();
        if (actx) {
          setWhoosh(0, 600);
          quietly(actx.suspend());
        }
      } else {
        if (actx) quietly(actx.resume());
        perf.warm = 1;
        startLoop();
      }
    });
    window.addEventListener('pageshow', function () {
      if (!document.hidden) startLoop();
    });

    // Android can take the GPU back while the app is in the background.
    canvas.addEventListener('webglcontextlost', function () {
      glLost = true;
      lostFor = 0;
    });
    canvas.addEventListener('webglcontextrestored', function () {
      glLost = false;
      // Baked reflections lose their pixels with the context, so bake them again.
      Object.keys(WORLDS).forEach(function (key) {
        var w = WORLDS[key];
        if (!w) return;
        w.env.dispose();
        w.env = bakeEnv(w.envScene);
      });
      scene.environment = activeWorld.env;
      perf.warm = 1.5;
    });

    startLoop();

    /* ================= Interface ================= */
    var resultEl = $('result'), tossBtn = $('tossBtn'), hintEl = $('hint');
    var lookBtn = $('lookBtn'), lookPanel = $('lookPanel');
    var NAMES = { H: 'Heads', T: 'Tails' };
    var SCENE_NAMES = { table: 'Table', ground: 'Ground' };

    function hintText() {
      return 'Tap the ' + activeWorld.surface + ' or press Space to toss';
    }

    function renderLook() {
      $('lookLabel').textContent = SCENE_NAMES[state.scene] + ' · ' + COIN_TYPES[state.coin].label;
      Array.prototype.forEach.call(lookPanel.querySelectorAll('[data-scene]'), function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.scene === state.scene));
      });
      Array.prototype.forEach.call(lookPanel.querySelectorAll('[data-coin]'), function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.coin === state.coin));
      });
    }

    function openLook(open) {
      if (open) {
        var r = lookBtn.getBoundingClientRect();
        lookPanel.style.top = Math.round(r.bottom + 8) + 'px';
        lookPanel.style.left = Math.round(r.left) + 'px';
      }
      lookPanel.hidden = !open;
      lookBtn.setAttribute('aria-expanded', String(open));
    }

    function renderTally() {
      $('nH').textContent = state.counts.H;
      $('nT').textContent = state.counts.T;
      var list = $('history');
      list.textContent = '';
      state.history.slice(0, 12).forEach(function (f) {
        var li = document.createElement('li');
        li.className = f === 'H' ? 'h' : 't';
        li.textContent = f;
        li.title = NAMES[f];
        list.appendChild(li);
      });
      $('reset').hidden = state.counts.H + state.counts.T === 0;
    }

    function renderCall() {
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
        chip.setAttribute('aria-pressed', String(chip.dataset.call === state.call));
      });
    }

    function renderSound() {
      var btn = $('sound');
      btn.setAttribute('aria-pressed', String(!state.muted));
      btn.setAttribute('aria-label', state.muted ? 'Sound off' : 'Sound on');
      if (actx && master) master.gain.setTargetAtTime(state.muted ? 0 : 0.9, actx.currentTime, 0.02);
    }

    function onLaunchUI() {
      openLook(false);
      lookBtn.disabled = true;
      resultEl.classList.remove('show');
      tossBtn.disabled = true;
      tossBtn.textContent = 'In the air';
      hintEl.textContent = '';
    }

    function onSuspenseUI() {
      document.body.classList.add('tense');
      tossBtn.textContent = 'Wait for it…';
    }

    function turnsLabel(turns) {
      var whole = Math.floor(turns);
      return turns - whole > 0.25 ? whole + '½' : String(whole);
    }

    function onResultUI(t) {
      var face = t.face;
      state.counts[face] += 1;
      state.history.unshift(face);
      state.history = state.history.slice(0, 40);
      state.face = face;
      persist();

      var streak = 0;
      while (streak < state.history.length && state.history[streak] === face) streak++;
      var total = state.counts.H + state.counts.T;

      $('resEyebrow').textContent = COIN_TYPES[state.coin].sides[face];
      $('resWord').textContent = NAMES[face];
      $('resMeta').textContent = 'Toss ' + total + ' · peak ' + Math.round(t.H * UNIT_CM) + ' cm · ' + turnsLabel(t.turns) + ' turns' +
        (streak >= 2 ? ' · ' + streak + ' in a row' : '');
      var verdict = $('verdict');
      verdict.className = 'verdict';
      if (state.call) {
        var won = state.call === face;
        verdict.textContent = won
          ? 'You won the toss. Bat or bowl?'
          : 'You called ' + NAMES[state.call] + ' and lost the toss.';
        verdict.classList.add(won ? 'win' : 'lose');
      } else {
        verdict.textContent = '';
      }
      void resultEl.offsetWidth;
      resultEl.classList.add('show');
      tossBtn.disabled = false;
      tossBtn.textContent = 'Toss again';
      lookBtn.disabled = false;
      hintEl.textContent = hintText();
      renderTally();
    }

    tossBtn.addEventListener('click', startToss);
    canvas.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (!lookPanel.hidden) {
        openLook(false);
        return;
      }
      startToss();
    });
    window.addEventListener('keydown', function (e) {
      if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'Escape') {
        openLook(false);
        return;
      }
      var onButton = e.target && e.target.closest && e.target.closest('button');
      if ((e.code === 'Space' || e.key === 'Enter') && !onButton) {
        e.preventDefault();
        startToss();
      } else if (e.key === 'h' || e.key === 'H' || e.key === 't' || e.key === 'T') {
        var c = e.key.toUpperCase();
        state.call = state.call === c ? null : c;
        renderCall();
        persist();
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
      chip.addEventListener('click', function () {
        state.call = state.call === chip.dataset.call ? null : chip.dataset.call;
        renderCall();
        persist();
      });
    });
    $('sound').addEventListener('click', function () {
      state.muted = !state.muted;
      ensureAudio();
      renderSound();
      persist();
    });
    $('reset').addEventListener('click', function () {
      state.counts = { H: 0, T: 0 };
      state.history = [];
      persist();
      renderTally();
      resultEl.classList.remove('show');
    });

    lookBtn.addEventListener('click', function () {
      openLook(lookPanel.hidden);
    });
    Array.prototype.forEach.call(lookPanel.querySelectorAll('[data-scene]'), function (b) {
      b.addEventListener('click', function () {
        if (phase !== 'idle' || state.scene === b.dataset.scene) return;
        state.scene = b.dataset.scene;
        setScene(state.scene, true);
        persist();
        renderLook();
        resultEl.classList.remove('show');
        hintEl.textContent = hintText();
      });
    });
    Array.prototype.forEach.call(lookPanel.querySelectorAll('[data-coin]'), function (b) {
      b.addEventListener('click', function () {
        if (phase !== 'idle' || state.coin === b.dataset.coin) return;
        state.coin = b.dataset.coin;
        applyCoin(state.coin);
        persist();
        renderLook();
        resultEl.classList.remove('show');
      });
    });

    renderTally();
    renderCall();
    renderSound();
    renderLook();
    hintEl.textContent = hintText();
  }
})();
</script>
</body>
</html>
