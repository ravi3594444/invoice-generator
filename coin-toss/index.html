<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heads or Tails</title>
<meta name="description" content="Toss a fully animated 3D cricket toss coin. The camera rides up with it, then it lands heads or tails.">
<meta name="theme-color" content="#0B1417">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0B1417;
    --ink-soft: rgba(11, 20, 23, 0.62);
    --gold: #D2A54C;
    --gold-hi: #F3D48A;
    --silver: #D9DEE1;
    --amber: #F4B860;
    --parchment: #F1E7D0;
    --sage: #93A29C;
    --line: rgba(241, 231, 208, 0.16);
    --win: #A8D59A;
    --lose: #EE9C86;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--parchment);
    font: 15px/1.45 Manrope, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- 3D stage ---------- */
  #stage { position: fixed; inset: 0; background: var(--ink); }
  #stage canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(11, 20, 23, 0.72), rgba(11, 20, 23, 0) 20%, rgba(11, 20, 23, 0) 60%, rgba(11, 20, 23, 0.8)),
      radial-gradient(120% 90% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(4, 8, 10, 0.55));
  }

  /* While the coin spins on its edge, everything but the coin falls back. */
  #stage .focus {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(60% 50% at 50% 50%, rgba(3, 6, 8, 0) 45%, rgba(3, 6, 8, 0.75));
    transition: opacity 0.8s ease;
  }
  body.tense #stage .focus { opacity: 1; }
  .top, .call, .hint { transition: opacity 0.6s ease; }
  body.tense .top, body.tense .call, body.tense .hint { opacity: 0.3; }

  /* ---------- HUD ---------- */
  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding-block: calc(env(safe-area-inset-top, 0px) + 18px) calc(env(safe-area-inset-bottom, 0px) + 20px);
    padding-inline: max(16px, env(safe-area-inset-left, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px) + 16px);
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background:
      radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 46%),
      radial-gradient(circle, #E3B85E 0 40%, #5E4E30 41% 45%, #DDE2E4 46% 76%, #979EA3 77% 100%);
    box-shadow: 0 0 18px rgba(244, 184, 96, 0.3);
  }
  .brand h1 {
    margin: 0;
    font: 800 15px/1.1 Manrope, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--sage); }

  .score { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .tally { display: flex; align-items: center; gap: 14px; }
  .count { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
  .count .k { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); margin-bottom: 4px; }
  .count .v { font: 700 20px/1 Manrope, "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; padding: 0;
    display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--ink-soft); color: var(--parchment);
    cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn .off { display: none; }
  .icon-btn[aria-pressed="false"] .on { display: none; }
  .icon-btn[aria-pressed="false"] .off { display: block; }
  .history { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; justify-content: flex-end; max-width: min(58vw, 300px); overflow: hidden; }
  .history li {
    flex: none; width: 18px; height: 18px; border-radius: 50%;
    display: grid; place-items: center;
    font: 800 9px/1 Manrope, "Segoe UI", system-ui, sans-serif;
  }
  .history li.h { background: linear-gradient(160deg, #F3D48A, #B8872F); color: #3A2708; }
  .history li.t { border: 1.5px solid var(--silver); color: var(--silver); }
  .history li:first-child { box-shadow: 0 0 0 2px var(--ink), 0 0 0 3px var(--amber); }
  .reset {
    background: none; border: 0; padding: 2px 0; cursor: pointer;
    color: var(--sage); font: inherit; font-size: 11px; letter-spacing: 0.06em;
    text-decoration: underline; text-underline-offset: 3px;
  }

  .bottom { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .result {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    opacity: 0; transform: translateY(10px) scale(0.98);
    transition: opacity 0.45s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .result.show { opacity: 1; transform: none; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--amber); }
  .word {
    font: 800 clamp(46px, 13vw, 92px)/1 Manrope, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.08em;
    margin-right: -0.08em;
    text-transform: uppercase;
    color: var(--parchment);
    text-shadow: 0 2px 30px rgba(244, 184, 96, 0.35);
  }
  .result.show .word { animation: strike 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes strike { from { letter-spacing: 0.32em; opacity: 0; } to { letter-spacing: 0.08em; opacity: 1; } }
  .meta { font: 500 12px/1.4 Manrope, "Segoe UI", system-ui, sans-serif; color: var(--sage); font-variant-numeric: tabular-nums; }
  .verdict { font-weight: 700; font-size: 14px; }
  .verdict:empty { display: none; }
  .verdict.win { color: var(--win); }
  .verdict.lose { color: var(--lose); }

  .controls { pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 10px 14px; flex-wrap: wrap; }
  .call { display: flex; align-items: center; gap: 6px; }
  .call .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sage); margin-right: 4px; }
  .chip {
    border: 1px solid var(--line); background: var(--ink-soft); color: var(--parchment);
    font: 700 13px/1 Manrope, "Segoe UI", system-ui, sans-serif;
    padding: 10px 14px; border-radius: 999px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #2A1C08; }
  .toss {
    border: 0; border-radius: 999px; padding: 15px 34px; cursor: pointer;
    font: 800 15px/1 Manrope, "Segoe UI", system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase;
    color: #2A1A06;
    background: linear-gradient(180deg, #F7D98F, #C8923B);
    box-shadow: 0 10px 30px rgba(244, 184, 96, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(90, 55, 10, 0.35);
  }
  .toss:active { transform: translateY(1px); }
  .toss:disabled { cursor: default; opacity: 0.5; }
  .hint { margin: 0; font-size: 12px; color: var(--sage); min-height: 1.45em; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  .fallback {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-inline: 24px; text-align: center; background: var(--ink); color: var(--parchment);
  }
  .fallback p { max-width: 36ch; }

  @media (max-width: 520px) {
    .brand p { display: none; }
    .brand h1 { font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .result { transition: opacity 0.2s linear; transform: none; }
    .result.show .word { animation: none; }
  }
</style>
</head>
<body>
<main id="app">
  <div id="stage"><canvas id="scene" aria-hidden="true"></canvas><div class="focus" aria-hidden="true"></div></div>

  <div class="hud">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Heads or Tails</h1>
          <p>Fair 50/50 from your browser's secure random generator</p>
        </div>
      </div>
      <div class="score">
        <div class="tally">
          <div class="count"><span class="k">Heads</span><span class="v" id="nH">0</span></div>
          <div class="count"><span class="k">Tails</span><span class="v" id="nT">0</span></div>
          <button id="sound" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
          </button>
        </div>
        <ol class="history" id="history" aria-label="Recent tosses, newest first"></ol>
        <button class="reset" id="reset" type="button" hidden>Reset tally</button>
      </div>
    </header>

    <footer class="bottom">
      <div class="result" id="result" aria-live="polite">
        <div class="eyebrow" id="resEyebrow"></div>
        <div class="word" id="resWord"></div>
        <div class="meta" id="resMeta"></div>
        <div class="verdict" id="verdict"></div>
      </div>
      <div class="controls">
        <div class="call" role="group" aria-label="Call it before you toss">
          <span class="label">Call it</span>
          <button class="chip" type="button" data-call="H" aria-pressed="false">Heads</button>
          <button class="chip" type="button" data-call="T" aria-pressed="false">Tails</button>
        </div>
        <button class="toss" id="tossBtn" type="button">Toss</button>
      </div>
      <p class="hint" id="hint">Tap the table or press Space to toss</p>
    </footer>
  </div>

  <div class="fallback" id="fallback" hidden><p id="fallbackMsg"></p></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});

  function showFallback(msg) {
    $('fallbackMsg').textContent = msg;
    $('fallback').hidden = false;
  }

  function start(hotData) {
    var T3 = window.THREE;
    if (!T3) {
      showFallback('The 3D engine did not load. Check your connection and reload the page.');
      return;
    }

    /* ================= Per-viewer state ================= */
    var KEY = 'heads-or-tails:v1';
    function loadSaved() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    }
    var saved = Object.assign({}, loadSaved(), hotData || {});
    var state = {
      counts: { H: (saved.counts && saved.counts.H) | 0, T: (saved.counts && saved.counts.T) | 0 },
      history: Array.isArray(saved.history) ? saved.history.filter(function (f) { return f === 'H' || f === 'T'; }).slice(0, 40) : [],
      call: saved.call === 'H' || saved.call === 'T' ? saved.call : null,
      muted: !!saved.muted,
      face: saved.face === 'T' ? 'T' : 'H'
    };
    function persist() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
    }
    try {
      if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return state; });
    } catch (e) { /* hot reload unsupported */ }

    var reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    /* ================= Randomness ================= */
    function fairFace() {
      if (window.crypto && crypto.getRandomValues) {
        var b = new Uint8Array(1);
        crypto.getRandomValues(b);
        return (b[0] & 1) ? 'H' : 'T';
      }
      return Math.random() < 0.5 ? 'H' : 'T';
    }
    var rnd = Math.random;

    /* ================= Renderer ================= */
    var canvas = $('scene');
    var renderer;
    try {
      renderer = new T3.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      showFallback('This browser could not start WebGL, which the 3D coin needs. Try another browser or device.');
      return;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = T3.sRGBEncoding;
    renderer.toneMapping = T3.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T3.PCFSoftShadowMap;
    var maxAniso = renderer.capabilities.getMaxAnisotropy();

    var INK = 0x0B1417;
    var scene = new T3.Scene();
    scene.background = new T3.Color(INK);
    scene.fog = new T3.FogExp2(INK, 0.011);

    var camera = new T3.PerspectiveCamera(42, 1, 0.05, 500);

    function makeCanvas(w, h) {
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }
    function circlePath(ctx, x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }

    /* ================= Reflection environment ================= */
    (function buildEnvironment() {
      var env = new T3.Scene();
      var c = makeCanvas(8, 256), g = c.getContext('2d');
      var grd = g.createLinearGradient(0, 0, 0, 256);
      grd.addColorStop(0, '#fff4e0');
      grd.addColorStop(0.22, '#d2a263');
      grd.addColorStop(0.42, '#5b503e');
      grd.addColorStop(0.58, '#1d2a2b');
      grd.addColorStop(1, '#2c1d12');
      g.fillStyle = grd;
      g.fillRect(0, 0, 8, 256);
      var tex = new T3.CanvasTexture(c);
      tex.encoding = T3.sRGBEncoding;
      env.add(new T3.Mesh(new T3.SphereGeometry(10, 32, 16), new T3.MeshBasicMaterial({ map: tex, side: T3.BackSide })));
      var lampDisk = new T3.Mesh(new T3.CircleGeometry(2.6, 32), new T3.MeshBasicMaterial({ color: new T3.Color(7, 5.6, 3.8) }));
      lampDisk.position.set(0, 9, 0);
      lampDisk.rotation.x = Math.PI / 2;
      env.add(lampDisk);
      // Soft panels around the horizon give the coin edge its glints.
      var panelMat = new T3.MeshBasicMaterial({ color: new T3.Color(1.5, 1.35, 1.1), side: T3.DoubleSide });
      for (var i = 0; i < 5; i++) {
        var a = (i / 5) * Math.PI * 2 + 0.4;
        var p = new T3.Mesh(new T3.PlaneGeometry(3.2, 4.5), panelMat);
        p.position.set(Math.cos(a) * 8.5, 3.2, Math.sin(a) * 8.5);
        p.lookAt(0, 0, 0);
        env.add(p);
      }
      var pmrem = new T3.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(env, 0.035).texture;
      pmrem.dispose();
    })();

    /* ================= Coin ================= */
    var R = 1;            // coin radius (1 unit = 12 mm)
    var TH = 0.13;        // thickness
    var REST_Y = TH / 2;
    var UNIT_CM = 1.2;

    function arcText(ctx, text, cx, cy, radius, top, font, spacing) {
      ctx.save();
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var chars = Array.from(text);
      var widths = chars.map(function (ch) { return ctx.measureText(ch).width; });
      var total = widths.reduce(function (a, b) { return a + b; }, 0) + spacing * (chars.length - 1);
      var run = -total / 2;
      chars.forEach(function (ch, i) {
        var mid = run + widths[i] / 2;
        run += widths[i] + spacing;
        var a = top ? -Math.PI / 2 + mid / radius : Math.PI / 2 - mid / radius;
        ctx.save();
        ctx.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
        ctx.rotate(top ? a + Math.PI / 2 : a - Math.PI / 2);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // Engraved outline around the current path, so overlapping relief reads as separate pieces.
    function groove(ctx, C, width) {
      ctx.save();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = C.engrave;
      ctx.lineWidth = width;
      ctx.stroke();
      ctx.restore();
    }

    // A cricket ball with its double seam.
    function drawBall(ctx, x, y, r, C) {
      ctx.save();
      ctx.fillStyle = C.raised;
      circlePath(ctx, x, y, r);
      ctx.fill();
      ctx.clip();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = C.engrave;
      ctx.lineWidth = Math.max(1.5, r * 0.08);
      [-0.14, 0.14].forEach(function (o) {
        ctx.beginPath();
        ctx.arc(x - r * 1.55, y, r * (1.75 + o), -0.7, 0.7);
        ctx.stroke();
      });
      ctx.restore();
    }

    // Heads: two crossed bats, blades down, with a ball in the V of the handles.
    function drawBats(ctx, c, k, C) {
      ctx.save();
      ctx.translate(c, c + 18 * k);
      [-1, 1].forEach(function (dir) {
        var w = 38 * k;
        ctx.save();
        ctx.rotate(dir * 0.52);
        ctx.beginPath();
        ctx.moveTo(-w, -34 * k);
        ctx.lineTo(-w, 204 * k);
        ctx.quadraticCurveTo(-w, 236 * k, -w + 20 * k, 238 * k);
        ctx.lineTo(w - 20 * k, 238 * k);
        ctx.quadraticCurveTo(w, 236 * k, w, 204 * k);
        ctx.lineTo(w, -34 * k);
        ctx.quadraticCurveTo(w, -56 * k, 14 * k, -64 * k);
        ctx.lineTo(-14 * k, -64 * k);
        ctx.quadraticCurveTo(-w, -56 * k, -w, -34 * k);
        ctx.closePath();
        ctx.fillStyle = C.blade;
        ctx.fill();
        groove(ctx, C, 6 * k);
        ctx.save();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = C.raised;
        ctx.lineCap = 'round';
        ctx.lineWidth = 12 * k;
        ctx.beginPath();
        ctx.moveTo(0, -22 * k);
        ctx.lineTo(0, 212 * k);
        ctx.stroke();
        ctx.restore();
        roundRectPath(ctx, -13 * k, -176 * k, 26 * k, 118 * k, 12 * k);
        ctx.fillStyle = C.raised;
        ctx.fill();
        groove(ctx, C, 5 * k);
        ctx.save();
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = C.engrave;
        ctx.lineWidth = 4 * k;
        for (var i = 0; i < 6; i++) {
          var y = (-162 + i * 17) * k;
          ctx.beginPath();
          ctx.moveTo(-13 * k, y);
          ctx.lineTo(13 * k, y + 6 * k);
          ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
      });
      drawBall(ctx, 0, -128 * k, 40 * k, C);
      ctx.restore();
    }

    function drawLaurel(ctx, k, C, side) {
      var R0 = 256 * k;
      var a1 = Math.PI / 2 - side * 0.2;
      var a2 = Math.PI / 2 - side * 1.95;
      var fwd = a2 > a1 ? 1 : -1;
      ctx.strokeStyle = C.raised;
      ctx.lineWidth = 6 * k;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, R0, a1, a2, fwd < 0);
      ctx.stroke();
      ctx.fillStyle = C.raised;
      for (var i = 0; i < 9; i++) {
        var t = (i + 0.6) / 9.2;
        var a = a1 + (a2 - a1) * t;
        var scale = 1 - 0.4 * t;
        var heading = Math.atan2(Math.cos(a) * fwd, -Math.sin(a) * fwd);
        [1, -1].forEach(function (s) {
          var rr = R0 + s * 15 * k * scale;
          ctx.save();
          ctx.translate(Math.cos(a) * rr, Math.sin(a) * rr);
          ctx.rotate(heading + s * side * 0.55);
          ctx.beginPath();
          ctx.ellipse(10 * k * scale, 0, 22 * k * scale, 9 * k * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });
      }
    }

    // Tails: three stumps with the bails on top, framed by a laurel.
    function drawStumps(ctx, c, k, C) {
      ctx.save();
      ctx.translate(c, c - 6 * k);
      var top = -112, bottom = 168, w = 30;
      [-68, 0, 68].forEach(function (x) {
        roundRectPath(ctx, (x - w / 2) * k, top * k, w * k, (bottom - top) * k, 14 * k);
        ctx.fillStyle = C.raised;
        ctx.fill();
        groove(ctx, C, 5 * k);

    };
    coin.position.copy(rest.pos);
    flipQuat(coin.quaternion, rest.psi, 0, rest.theta);

    var phase = 'idle';
    var phaseT = 0;
    var toss = null;
    var shake = 0;

    function startToss() {
      if (phase !== 'idle') return;
      ensureAudio();
      var face = fairFace();
      var suspense = !reduceMotion;
      // With suspense on, the flip aims at either face at random. The coin then stands up
      // on its edge, and the way it finally tips over lands it on the result face.
      var aimFace = suspense ? (rnd() < 0.5 ? 'H' : 'T') : face;
      var H = reduceMotion ? 5.5 + rnd() * 1.5 : 18 + rnd() * 8;
      var T = reduceMotion ? 1.15 : 1.95 + ((H - 18) / 8) * 0.45;
      var d1 = 0.5 + rnd() * 0.25;
      var d2 = 0.2 + rnd() * 0.12;
      var y0 = REST_Y;
      var yTouch = contactY(d1);
      var g = (8 * H) / (T * T);
      var v0 = (yTouch - y0 + 0.5 * g * T * T) / T;
      var whole = reduceMotion ? 3 + Math.floor(rnd() * 2) : 7 + Math.floor(rnd() * 3);
      var fromBase = rest.theta;            // 0 (heads up) or PI (tails up)
      var aimBase = aimFace === 'H' ? 0 : Math.PI;
      var extra = fromBase === aimBase ? 0 : Math.PI;
      var thetaFinal = fromBase + whole * Math.PI * 2 + extra;
      var psiF = (rnd() - 0.5) * 0.7;
      var ang = rnd() * Math.PI * 2, rad = rnd() * 1.4;
      toss = {
        face: face,
        H: H, T: T, g: g, v0: v0, y0: y0,
        sx: rest.pos.x, sz: rest.pos.z,
        ex: rest.pos.x * 0.35 + Math.cos(ang) * rad,
        ez: rest.pos.z * 0.35 + Math.sin(ang) * rad,
        theta0: fromBase, thetaFinal: thetaFinal, thetaTouch: thetaFinal - d1,
        turns: whole + extra / (Math.PI * 2),
        psi0: rest.psi, psiF: psiF, yawWob: (rnd() - 0.5) * 1.2,
        beta: (rnd() < 0.5 ? -1 : 1) * (0.16 + rnd() * 0.14),
        orbitDir: rnd() < 0.5 ? -1 : 1,
        d1: d1, d2: d2, hop: 0.45 + rnd() * 0.4, Tc: 0.3, Td: 1.6,
        wdir: rnd() < 0.5 ? -1 : 1, K: 7.5, phi0: Math.PI - psiF, tickIdx: 0,
        qFinal: flipQuat(new T3.Quaternion(), psiF, 0, face === 'H' ? 0 : Math.PI)
      };
      if (suspense) {
        var fake = rnd() < 0.4;
        var thetaE = thetaFinal - Math.PI / 2;   // stands up on the edge it lands on
        var sigma = face === aimFace ? 1 : -1;   // tips forward onto the aimed face, or back onto the other
        var w1 = 4 + rnd() * 1.5;
        var alpha0 = 0.3;
        toss.susp = {
          Tup: 0.45, Tspin: 1.3 + rnd() * 0.6, Troll: fake ? 1.6 : 1.05, Tw: 1.35,
          thetaE: thetaE, sigma: sigma, betaF: thetaE + sigma * Math.PI / 2, fake: fake,
          w0: 13 + rnd() * 4, w1: w1, rate0: w1 / Math.sqrt(Math.sin(alpha0)),
          spinDir: rnd() < 0.5 ? -1 : 1, lean: 0.06 + rnd() * 0.05, alpha0: alpha0
        };
        toss.post = { phi: 0, beta: 0, psi: 0, rate: 0, tickAcc: 0, beatT: 0.2, beatGap: 0.86 };
      }
      phase = 'flight';
      phaseT = 0;
      soundFlick();
      onLaunchUI();
    }

    function impact(k) {
      if (!reduceMotion) shake = Math.max(shake, 0.16 * k);
      soundClink(k);
      try { if (navigator.vibrate) navigator.vibrate(k > 0.8 ? 16 : 8); } catch (e) { /* no haptics */ }
    }

    function settle() {
      phase = 'idle';
      rest.pos.set(toss.ex, REST_Y, toss.ez);
      rest.theta = toss.face === 'H' ? 0 : Math.PI;
      rest.psi = toss.psiF;
      coin.position.copy(rest.pos);
      coin.quaternion.copy(toss.qFinal);
      setWhoosh(0, 600);
      soundSettle();
      if (toss.susp) {
        document.body.classList.remove('tense');
        soundReveal();
      }
      onResultUI(toss);
    }

    // Angle between the coin and the table, whichever face is up.
    function flatTilt(beta) {
      var m = ((beta % Math.PI) + Math.PI) % Math.PI;
      return Math.min(m, Math.PI - m);
    }
    // Height of the centre with the lowest point of the rim on the table.
    function bodyY(beta) {
      return R * Math.abs(Math.sin(beta)) + (TH / 2) * Math.abs(Math.cos(beta));
    }
    // Orientation of a coin rolling on its rim: turn about the vertical (phi),
    // tip over (beta, 0 = heads up, PI = tails up), turn about its own face (psi).
    function rollQuat(out, phi, beta, psi) {
      out.setFromAxisAngle(AY, phi);
      qTmp.setFromAxisAngle(AX, beta);
      out.multiply(qTmp);
      qTmp2.setFromAxisAngle(AY, psi);
      out.multiply(qTmp2);
      return out;
    }

    function updateSuspense(dt, P, Q) {
      var S = toss.susp, st = toss.post, s;
      P.x = toss.ex;
      P.z = toss.ez;
      if (phase === 'stand') {
        // Bounces off the edge it landed on, pops up onto it and starts to spin.
        s = phaseT / S.Tup;
        st.beta = lerp(toss.thetaTouch, S.thetaE, easeOutCubic(s));
        st.rate = S.spinDir * lerp(1.5, S.w0, smooth01(s));
        P.y = bodyY(st.beta) + 0.35 * 4 * s * (1 - s);
      } else if (phase === 'spin') {
        // Spins on its edge and slows down while both faces flash past.
        s = phaseT / S.Tspin;
        st.rate = S.spinDir * (S.w1 + (S.w0 - S.w1) * Math.pow(1 - s, 1.4));
        var lean = S.fake ? 0 : S.sigma * S.lean * smooth01(s);
        st.beta = S.thetaE + lean + 0.035 * Math.sin(phaseT * 19) * (1 - s);
        P.y = bodyY(st.beta);
      } else if (phase === 'roll') {
        // Tips over, rolling on its rim. Sometimes it teeters the wrong way first.
        s = phaseT / S.Troll;
        var from = S.thetaE + (S.fake ? 0 : S.sigma * S.lean);
        var to = S.betaF - S.sigma * S.alpha0;
        if (S.fake) {
          var wrong = S.thetaE - S.sigma * 0.42;
          st.beta = s < 0.45
            ? lerp(from, wrong, smooth01(s / 0.45))
            : lerp(wrong, to, Math.pow((s - 0.45) / 0.55, 2));
        } else {
          st.beta = lerp(from, to, s * s);
        }
        st.rate = S.spinDir * S.w1 / Math.sqrt(Math.max(Math.sin(flatTilt(st.beta)), 0.2));
        P.y = bodyY(st.beta);
      } else {
        // The last rattle: flatter and flatter, faster and faster.
        s = phaseT / S.Tw;
        var alpha = S.alpha0 * Math.pow(1 - s, 1.6);
        st.beta = S.betaF - S.sigma * alpha;
        st.rate = S.spinDir * Math.min(140, S.rate0 * Math.sqrt(S.alpha0 / Math.max(alpha, 0.002)));
        P.y = bodyY(st.beta);
      }
      st.phi += st.rate * dt;
      st.psi -= st.rate * Math.cos(st.beta) * dt;   // rolls on its rim without slipping
      if (phase === 'rattle') {
        // Ease the face round so it reads upright once it lies flat.
        var up = toss.face === 'H' ? 1 : -1;
        var err = toss.psiF - (st.phi + up * st.psi);
        err = Math.atan2(Math.sin(err), Math.cos(err));
        st.psi += up * Math.max(-2.5 * dt, Math.min(2.5 * dt, err * (1 - Math.exp(-4 * dt))));
      }
      rollQuat(Q, st.phi, st.beta, st.psi);
      suspenseSound(dt);
    }

    function suspenseSound(dt) {
      var S = toss.susp, st = toss.post;
      var rate = Math.abs(st.rate);
      var step = phase === 'stand' || phase === 'spin' ? Math.PI : Math.PI / 2;
      st.tickAcc += rate * dt;
      if (st.tickAcc >= step) {
        st.tickAcc %= step;
        var tilt = flatTilt(st.beta);
        if (phase === 'rattle') soundTick(0.3 + 0.7 * tilt / S.alpha0, 1.4 + 0.6 * (1 - tilt / S.alpha0));
        else if (phase === 'roll') soundTick(0.75, 1 + 0.4 * (1 - tilt / (Math.PI / 2)));
        else soundTick(0.4, 0.85);
      }
      setWhoosh(phase === 'rattle' ? 0.014 * (1 - phaseT / S.Tw) : 0.014, 2200 + Math.min(rate, 60) * 35);
      if (phase === 'spin' || phase === 'roll') {
        st.beatT -= dt;
        if (st.beatT <= 0) {
          soundHeartbeat();
          st.beatT += st.beatGap;
          st.beatGap = Math.max(0.56, st.beatGap * 0.93);
        }
      }
    }

    function updateCoin(dt) {
      if (phase === 'idle') return;
      phaseT += dt;
      var S = toss.susp;
      if (phase === 'flight' && phaseT >= toss.T) {
        phaseT -= toss.T;
        impact(1);
        setWhoosh(0, 600);
        if (S) {
          phase = 'stand';
          toss.post.phi = toss.psiF;
          toss.post.beta = toss.thetaTouch;
          toss.post.psi = 0;
          onSuspenseUI();
        } else {
          phase = 'hop';
        }
      }
      if (phase === 'hop' && phaseT >= toss.Tc) { phaseT -= toss.Tc; phase = 'wobble'; impact(0.4); }
      if (phase === 'wobble' && phaseT >= toss.Td) { settle(); return; }
      if (phase === 'stand' && phaseT >= S.Tup) { phaseT -= S.Tup; phase = 'spin'; soundClink(0.3); }
      if (phase === 'spin' && phaseT >= S.Tspin) { phaseT -= S.Tspin; phase = 'roll'; }
      if (phase === 'roll' && phaseT >= S.Troll) { phaseT -= S.Troll; phase = 'rattle'; }
      if (phase === 'rattle' && phaseT >= S.Tw) { settle(); return; }

      var P = coin.position, Q = coin.quaternion, s;
      if (phase === 'flight') {
        var t = phaseT;
        s = t / toss.T;
        P.x = lerp(toss.sx, toss.ex, s);
        P.z = lerp(toss.sz, toss.ez, s);
        P.y = toss.y0 + toss.v0 * t - 0.5 * toss.g * t * t;
        var theta = lerp(toss.theta0, toss.thetaTouch, s);
        var psi = lerp(toss.psi0, toss.psiF, smooth01(s)) + toss.yawWob * Math.sin(Math.PI * s);
        flipQuat(Q, psi, toss.beta * Math.sin(Math.PI * s), theta);
        var edgeOn = Math.abs(Math.sin(theta));
        var env = Math.pow(Math.sin(Math.PI * Math.min(1, s * 1.05)), 0.6);
        setWhoosh(0.05 * env * (0.3 + 0.7 * edgeOn), 600 + 1300 * edgeOn);
      } else if (phase === 'hop') {
        s = phaseT / toss.Tc;
        var tilt = lerp(toss.d1, toss.d2, easeOutCubic(s));
        P.set(toss.ex, contactY(tilt) + toss.hop * 4 * s * (1 - s), toss.ez);
        flipQuat(Q, toss.psiF, 0, toss.thetaFinal - tilt);
      } else if (phase === 'wobble') {
        // Settles like a spun coin: the tilt shrinks while the rocking speeds up.
        s = phaseT / toss.Td;
        var alpha = toss.d2 * Math.pow(1 - s, 1.6);
        var prog = -Math.log(1 - 0.985 * s);
        var phi = toss.phi0 + toss.wdir * toss.K * prog;
        P.set(toss.ex, contactY(alpha), toss.ez);
        axisTmp.set(Math.cos(phi), 0, Math.sin(phi));
        Q.setFromAxisAngle(axisTmp, alpha).multiply(toss.qFinal);
        var idx = Math.floor((toss.K * prog) / (Math.PI / 2));
        if (idx > toss.tickIdx) {
          toss.tickIdx = idx;
          soundTick(alpha / toss.d2, 1 + s * 0.6);
        }
      } else {
        updateSuspense(dt, P, Q);
      }
    }

    /* ================= Camera: rides up with the coin ================= */
    var camPos = new T3.Vector3(), camLook = new T3.Vector3(), wantPos = new T3.Vector3(), wantLook = new T3.Vector3();
    var lowPos = new T3.Vector3(), highPos = new T3.Vector3();
    var camFov = 42;
    var clock = 0;
    var tension = 0;

    function framing() { return Math.max(1, 0.78 / camera.aspect); }
    function baseFov() { return camera.aspect < 1 ? 48 : 40; }

    function updateCamera(dt) {
      var f = framing();
      var c = coin.position;
      var rateP, rateL, fov = baseFov();
      if (reduceMotion) {
        wantPos.set(rest.pos.x, 7.5 * f, rest.pos.z + 9 * f);
        wantLook.set(rest.pos.x, phase === 'idle' ? 0.2 : 2.6, rest.pos.z + 0.4 * f);
        rateP = 2; rateL = 3;
      } else if (phase === 'flight') {
        var s = phaseT / toss.T;
        var orbit = toss.orbitDir * 0.95 * Math.sin(Math.PI * s);
        var dist = (4.6 + 1.4 * Math.sin(Math.PI * s)) * f;
        var yOff = lerp(-1.8, 2.8, smoothRange(0.3, 0.8, s));
        wantPos.set(c.x + Math.sin(orbit) * dist, c.y + yOff, c.z + Math.cos(orbit) * dist);
        wantLook.copy(c);
        rateP = 5.5; rateL = 22; fov += 10;
      } else if (phase === 'stand' || phase === 'spin' || phase === 'roll') {
        // Down at table level, where nobody can tell which way it will fall.
        var S = toss.susp;
        var rise = phase === 'roll' ? smoothRange(0.62, 1, phaseT / S.Troll) : 0;
        var push = phase === 'spin' ? smooth01(phaseT / S.Tspin) : (phase === 'roll' ? 1 : 0);
        var az = 0.22 * Math.sin(clock * 0.45);
        var D = (6.2 - 1.1 * push) * f;
        lowPos.set(c.x + Math.sin(az) * D, 1.15, c.z + Math.cos(az) * D);
        highPos.set(c.x, 3.8 * f, c.z + 3.6 * f);
        wantPos.copy(lowPos).lerp(highPos, rise);
        wantLook.set(c.x, lerp(0.85, 0.1, rise), c.z + 0.3 * f * rise);
        rateP = phase === 'stand' ? 3 : 2.4; rateL = 6;
      } else if (phase === 'hop' || phase === 'wobble' || phase === 'rattle') {
        wantPos.set(c.x, 3.8 * f, c.z + 3.6 * f);
        wantLook.set(c.x, 0.1, c.z + 0.3 * f);
        rateP = 3.2; rateL = 8; fov += 2;
      } else {
        wantPos.set(c.x + Math.sin(clock * 0.25) * 0.25, 5.2 * f, c.z + 3.9 * f);
        wantLook.set(c.x, 0.1, c.z + 0.55 * f);
        rateP = 1.8; rateL = 3;
      }
      camPos.lerp(wantPos, 1 - Math.exp(-rateP * dt));
      camLook.lerp(wantLook, 1 - Math.exp(-rateL * dt));
      if (camPos.y < 0.7) camPos.y = 0.7;
      camFov += (fov - camFov) * (1 - Math.exp(-3 * dt));
      camera.position.copy(camPos);
      if (shake > 0.0005) {
        camera.position.x += (Math.random() - 0.5) * shake;
        camera.position.y += (Math.random() - 0.5) * shake;
        camera.position.z += (Math.random() - 0.5) * shake;
        shake *= Math.exp(-dt * 9);
      }
      camera.fov = camFov;
      camera.updateProjectionMatrix();
      camera.lookAt(camLook);
    }

    function updateDust(dt) {
      var arr = dustGeo.attributes.position.array;
      for (var i = 0; i < DUST; i++) {
        var y = arr[i * 3 + 1] + dustVel[i] * dt;
        arr[i * 3 + 1] = y > 60.4 ? 0.4 : y;
      }
      dustGeo.attributes.position.needsUpdate = true;
      dust.rotation.y += dt * 0.012;
    }

    /* ================= Resize & loop ================= */
    function resize() {
      var w = window.innerWidth || 1, h = window.innerHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    // Open on a slow settle into the resting view.
    camFov = baseFov();
    camPos.set(0, 11 * framing(), 11 * framing());
    camLook.set(0, 0, 0);

    var last = performance.now();
    function frame(now) {
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      clock += dt;
      updateCoin(dt);
      updateCamera(dt);
      updateDust(dt);
      // While the coin spins on its edge: the room dims, the beam brightens and a soft
      // light from the camera side lets you catch each face as it turns past.
      var tenseNow = phase === 'stand' || phase === 'spin' || phase === 'roll';
      tension += ((tenseNow ? 1 : 0) - tension) * (1 - Math.exp(-2.5 * dt));
      renderer.toneMappingExposure = 1.05 - 0.14 * tension;
      beam.material.uniforms.uStrength.value = 0.13 + 0.08 * tension;
      faceLight.intensity = 0.9 * tension;
      faceLight.position.set(camera.position.x, camera.position.y + 1.5, camera.position.z);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ================= Interface ================= */
    var resultEl = $('result'), tossBtn = $('tossBtn'), hintEl = $('hint');
    var NAMES = { H: 'Heads', T: 'Tails' };
    var IDLE_HINT = 'Tap the table or press Space to toss';

    function renderTally() {
      $('nH').textContent = state.counts.H;
      $('nT').textContent = state.counts.T;
      var list = $('history');
      list.textContent = '';
      state.history.slice(0, 12).forEach(function (f) {
        var li = document.createElement('li');
        li.className = f === 'H' ? 'h' : 't';
        li.textContent = f;
        li.title = NAMES[f];
        list.appendChild(li);
      });
      $('reset').hidden = state.counts.H + state.counts.T === 0;
    }

    function renderCall() {
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
        chip.setAttribute('aria-pressed', String(chip.dataset.call === state.call));
      });
    }

    function renderSound() {
      var btn = $('sound');
      btn.setAttribute('aria-pressed', String(!state.muted));
      btn.setAttribute('aria-label', state.muted ? 'Sound off' : 'Sound on');
      if (actx && master) master.gain.setTargetAtTime(state.muted ? 0 : 0.9, actx.currentTime, 0.02);
    }

    function onLaunchUI() {
      resultEl.classList.remove('show');
      tossBtn.disabled = true;
      tossBtn.textContent = 'In the air';
      hintEl.textContent = '';
    }

    function onSuspenseUI() {
      document.body.classList.add('tense');
      tossBtn.textContent = 'Wait for it…';
    }

    function turnsLabel(turns) {
      var whole = Math.floor(turns);
      return turns - whole > 0.25 ? whole + '½' : String(whole);
    }

    function onResultUI(t) {
      var face = t.face;
      state.counts[face] += 1;
      state.history.unshift(face);
      state.history = state.history.slice(0, 40);
      state.face = face;
      persist();

      var streak = 0;
      while (streak < state.history.length && state.history[streak] === face) streak++;
      var total = state.counts.H + state.counts.T;

      $('resEyebrow').textContent = face === 'H' ? 'Crossed bats side up' : 'Stumps side up';
      $('resWord').textContent = NAMES[face];
      $('resMeta').textContent = 'Toss ' + total + ' · peak ' + Math.round(t.H * UNIT_CM) + ' cm · ' + turnsLabel(t.turns) + ' turns' +
        (streak >= 2 ? ' · ' + streak + ' in a row' : '');
      var verdict = $('verdict');
      verdict.className = 'verdict';
      if (state.call) {
        var won = state.call === face;
        verdict.textContent = won
          ? 'You won the toss. Bat or bowl?'
          : 'You called ' + NAMES[state.call] + ' and lost the toss.';
        verdict.classList.add(won ? 'win' : 'lose');
      } else {
        verdict.textContent = '';
      }
      void resultEl.offsetWidth;
      resultEl.classList.add('show');
      tossBtn.disabled = false;
      tossBtn.textContent = 'Toss again';
      hintEl.textContent = IDLE_HINT;
      renderTally();
    }

    tossBtn.addEventListener('click', startToss);
    canvas.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startToss();
    });
    window.addEventListener('keydown', function (e) {
      if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      var onButton = e.target && e.target.closest && e.target.closest('button');
      if ((e.code === 'Space' || e.key === 'Enter') && !onButton) {
        e.preventDefault();
        startToss();
      } else if (e.key === 'h' || e.key === 'H' || e.key === 't' || e.key === 'T') {
        var c = e.key.toUpperCase();
        state.call = state.call === c ? null : c;
        renderCall();
        persist();
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
      chip.addEventListener('click', function () {
        state.call = state.call === chip.dataset.call ? null : chip.dataset.call;
        renderCall();
        persist();
      });
    });
    $('sound').addEventListener('click', function () {
      state.muted = !state.muted;
      ensureAudio();
      renderSound();
      persist();
    });
    $('reset').addEventListener('click', function () {
      state.counts = { H: 0, T: 0 };
      state.history = [];
      persist();
      renderTally();
      resultEl.classList.remove('show');
    });

    renderTally();
    renderCall();
    renderSound();
    hintEl.textContent = IDLE_HINT;
  }
})();
</script>
</body>
</html>
